 changing light.<\/h1><\/div><p class=\"right-note\">An invitation to stay a little longer with what changes.<\/p><\/section><div class=\"garden-panorama\"><a class=\"art-link \" href=\"#works/water-lilies\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_water-lilies.webp\" srcset=\"../../art-city/artworks/monet_water-lilies.webp 500w, ../../art-city/artworks/monet_water-lilies.webp 960w, ../../art-city/artworks/monet_water-lilies.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Water Lilies. A pond fills the frame.\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/monet_water-lilies.webp\"><div class=\"image-fallback\"><span>Water Lilies<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Water Lilies<\/span><span class=\"art-group\">Water<\/span><\/span><span class=\"art-year\">1906<\/span><\/figcaption><\/figure><\/a><\/div><section class=\"garden-middle\"><div><p class=\"eyebrow\">01 / The garden<\/p><h2>A place to return to.<\/h2><p>These paintings begin with patient attention. Water, leaves, and light become a reason to look again.<\/p><a class=\"text-link\" href=\"#works\">Walk through the paintings <span aria-hidden=\"true\">↗<\/span><\/a><\/div><a class=\"art-link \" href=\"#works/japanese-footbridge\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_japanese-footbridge.webp\" srcset=\"../../art-city/artworks/monet_japanese-footbridge.webp 500w, ../../art-city/artworks/monet_japanese-footbridge.webp 960w, ../../art-city/artworks/monet_japanese-footbridge.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Japanese Footbridge. The bridge draws a firm arc through foliage.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/monet_japanese-footbridge.webp\"><div class=\"image-fallback\"><span>The Japanese Footbridge<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Japanese Footbridge<\/span><span class=\"art-group\">Garden<\/span><\/span><span class=\"art-year\">1899<\/span><\/figcaption><\/figure><\/a><\/section><section class=\"garden-bottom\"><div><p class=\"eyebrow\">02 / Looking notes<\/p><h2>Where does the sky begin?<\/h2><p>A short guide to looking at reflections, surfaces, and the missing horizon.<\/p><a class=\"text-link\" href=\"#extra\">Read the looking notes <span aria-hidden=\"true\">↗<\/span><\/a><\/div><a class=\"art-link \" href=\"#works/poppy-field\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_poppy-field.webp\" srcset=\"../../art-city/artworks/monet_poppy-field.webp 500w, ../../art-city/artworks/monet_poppy-field.webp 960w, ../../art-city/artworks/monet_poppy-field.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Poppy Field. Bright red marks lead the eye through pale grasses.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/monet_poppy-field.webp\"><div class=\"image-fallback\"><span>Poppy Field<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Poppy Field<\/span><span class=\"art-group\">Garden<\/span><\/span><span class=\"art-year\">1873<\/span><\/figcaption><\/figure><\/a><\/section><\/div><\/main>", "title": "Claude Monet — The garden as a gallery"}, "works": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Selected works / 01–06<\/p><h1>In the light.<\/h1><p class=\"intro\">A selected collection, not a catalogue raisonné. Open any work for its image, context, and source record.<\/p><\/header><form class=\"filter-bar\" data-filters role=\"search\"><label for=\"work-search\">Find a work<input id=\"work-search\" type=\"search\" name=\"search\" placeholder=\"Title, year, or subject\" autocomplete=\"off\"><\/label><label for=\"work-category\">Browse by theme<select id=\"work-category\" name=\"category\"><option value=\"all\">All themes<\/option><option value=\"Water\">Water<\/option><option value=\"Figures\">Figures<\/option><option value=\"Garden\">Garden<\/option><\/select><\/label><button type=\"button\" data-reset>Reset<\/button><output class=\"result-count\" data-result-count aria-live=\"polite\">6 of 6 works<\/output><\/form><section class=\"works-collection\" data-collection aria-label=\"Selected artworks\"><article class=\"work-item \" data-group=\"Water\" data-stage=\"Water\" data-search=\"Water Lilies 1906 Water A pond fills the frame. Floating leaves interrupt a field of reflected sky; distance is suggested by color rather than a horizon.\" data-work=\"water-lilies\"><a class=\"art-link \" href=\"#works/water-lilies\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_water-lilies.webp\" srcset=\"../../art-city/artworks/monet_water-lilies.webp 500w, ../../art-city/artworks/monet_water-lilies.webp 960w, ../../art-city/artworks/monet_water-lilies.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Water Lilies. A pond fills the frame.\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/monet_water-lilies.webp\"><div class=\"image-fallback\"><span>Water Lilies<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Water Lilies<\/span><span class=\"art-group\">Water<\/span><\/span><span class=\ woman-with-a-parasol.webp 960w, ../../art-city/artworks/monet_woman-with-a-parasol.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Woman with a Parasol — Madame Monet and Her Son. The viewpoint is low and the sky expansive.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/monet_woman-with-a-parasol.webp\"><div class=\"image-fallback\"><span>Woman with a Parasol — Madame Monet and Her Son<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Woman with a Parasol — Madame Monet and Her Son<\/span><span class=\"art-group\">Figures<\/span><\/span><span class=\"art-year\">1875<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Garden\" data-stage=\"Garden\" data-search=\"Poppy Field 1873 Garden Bright red marks lead the eye through pale grasses. The figures are part of the field’s rhythm, not isolated from it.\" data-work=\"poppy-field\"><a class=\"art-link \" href=\"#works/poppy-field\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_poppy-field.webp\" srcset=\"../../art-city/artworks/monet_poppy-field.webp 500w, ../../art-city/artworks/monet_poppy-field.webp 960w, ../../art-city/artworks/monet_poppy-field.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Poppy Field. Bright red marks lead the eye through pale grasses.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/monet_poppy-field.webp\"><div class=\"image-fallback\"><span>Poppy Field<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Poppy Field<\/span><span class=\"art-group\">Garden<\/span><\/span><span class=\"art-year\">1873<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Garden\" data-stage=\"Garden\" data-search=\"The Japanese Footbridge 1899 Garden The bridge draws a firm arc through foliage. Beneath it, floating plants and reflections loosen the distinction between solid and liquid.\" data-work=\"japanese-footbridge\"><a class=\"art-link \" href=\"#works/japanese-footbridge\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_japanese-footbridge.webp\" srcset=\"../../art-city/artworks/monet_japanese-footbridge.webp 500w, ../../art-city/artworks/monet_japanese-footbridge.webp 960w, ../../art-city/artworks/monet_japanese-footbridge.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Japanese Footbridge. The bridge draws a firm arc through foliage.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/monet_japanese-footbridge.webp\"><div class=\"image-fallback\"><span>The Japanese Footbridge<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Japanese Footbridge<\/span><span class=\"art-group\">Garden<\/span><\/span><span class=\"art-year\">1899<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Garden\" data-stage=\"Garden\" data-search=\"Water Lilies and Japanese Bridge 1899 Garden The garden closes around a footbridge, while the pool opens another space below. Similar greens take on different weights in water and air.\" data-work=\"water-lilies-and-bridge\"><a class=\"art-link \" href=\"#works/water-lilies-and-bridge\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_water-lilies-and-bridge.webp\" srcset=\"../../art-city/artworks/monet_water-lilies-and-bridge.webp 500w, ../../art-city/artworks/monet_water-lilies-and-bridge.webp 960w, ../../art-city/artworks/monet_water-lilies-and-bridge.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Water Lilies and Japanese Bridge. The garden closes around a footbridge, while the pool opens another space below.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/monet_water-lilies-and-bridge.webp\"><div class=\"image-fallback\"><span>Water Lilies and Japanese Bridge<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Water Lilies and Japanese Bridge<\/span><span class=\"art-group\">Garden<\/span><\/span><span class=\"art-year\">1899<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — Claude Monet"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>Claude Monet<\/h1><p class=\"intro\">1840–1926 / Painting / France<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/impression-sunrise\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_impression-sunrise.webp\" srcset=\"../../art-city/artworks/monet_impression-sunrise.webp 500w, ../../art-city/artworks/monet_impression-sunrise.webp 960w, ../../art-city/artworks/monet_impression-sunrise.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Impression, Sunrise. A small orange sun and its reflection hold their place against a harbor of blue-gray strokes.\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/monet_impression-sunrise.webp\"><div class=\"image-fallback\"><span>Impression, Sunrise<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Impression, Sunrise<\/span><span class=\"art-group\">Water<\/span><\/span><span class=\"art-year\">1872<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>Claude Monet was a French painter whose sustained observation of light helped shape Impressionism. He returned to familiar subjects—rivers, gardens, and the changing weather—without treating their appearance as fixed.<\/p><p>At Giverny, the garden became both a place to live and a subject to revisit. The water-lily paintings let the surface of a pond hold reflections, plants, and sky within the same field.<\/p><h2>A way of looking<\/h2><p>This selection follows a movement from the open landscape toward the water’s surface. Look for the point where a painted mark describes a thing, and the point where it becomes light.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://www.musee-orangerie.fr/en/collection/claude-monet-water-lilies\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — Claude Monet"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1874<\/span><div><h2>First Impressionist exhibition<\/h2><p>Monet exhibited with the independent group in Paris.<\/p><a href=\"https://www.musee-orsay.fr/en/artworks/coquelicots-1010\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1909<\/span><div><h2>Les Nymphéas, séries de paysages d’eau<\/h2><p>Galerie Durand-Ruel, Paris.<\/p><a href=\"https://api.artic.edu/api/v1/artworks/16568\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1995<\/span><div><h2>Claude Monet: 1840–1926<\/h2><p>Art Institute of Chicago. Historical exhibition.<\/p><a href=\"https://api.artic.edu/api/v1/artworks/16568\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — Claude Monet"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1>Continue the conversation.<\/h1><p class=\"intro\">For collection research, visiting information, and image requests, contact the relevant institution through its official website.<\/p><\/header><div class=\"contact-grid\"><section><h2>Go to the source.<\/h2><a class=\"resource-link\" href=\"https://www.musee-orangerie.fr/en\" target=\"_blank\" rel=\"noopener noreferrer\">Musée de l’Orangerie ↗<span>Official institution · collection and contact channels<\/span><\/a><a class=\"resource-link\" href=\"https://www.musee-orangerie.fr/en/collection/claude-monet-water-lilies\" target=\"_blank\" rel=\"noopener noreferrer\">Biography &amp; research ↗<span>Background reading and further context<\/span><\/a><a class=\"resource-link\" href=\"#credits\">Image credits &amp; sources →<span>Artwork records, attributions, and reuse information<\/span><\/a><p class=\"editorial-note\">No representation, affiliation, authentication service, artwork sale, or estate contact is implied. This site does not accept messages on behalf of the artist.<\/p><\/section><section><h2>Prepare an inquiry.<\/h2><p class=\"small\" style=\"margin-bottom:25px\">Save a plain-text draft to send through an institution’s official channel. Nothing is transmitted or stored by this website.<\/p><form class=\"draft-form\" data-artist=\"Claude Monet\"><label for=\"inquiry-subject\">Subject<input id=\"inquiry-subject\" name=\"subject\" required maxlength=\"160\" placeholder=\"Question about a work or collection\"><\/label><label for=\"inquiry-message\">Your question<textarea id=\"inquiry-message\" name=\"message\" required minlength=\"10\" maxlength=\"5000\" placeholder=\"Include the artwork title, date, and what you would like to know.\"><\/textarea><\/label><button type=\"submit\">Download inquiry draft ↓<\/button><p class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/p><\/form><\/section><\/div><\/main>", "title": "Contact & resources — Claude Monet"}, "credits": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Sources &amp; image credits<\/p><h1>The record behind the image.<\/h1><p class=\"intro\">Artwork metadata and images are linked individually. Descriptions and looking notes are original editorial writing; no invented artist quotations are used.<\/p><\/header><p class=\"extra-intro small\">Artwork reproductions load from Wikimedia Commons or the linked institution. Reuse conditions attach to individual files. Photographs of sculptures can have separate copyrights from the sculpture itself. Consult each source record before republication. Cover images may be cropped; detail pages show the complete supplied image.<\/p><ul class=\"credits-list\"><li><span class=\"meta\">01<\/span><div><h2>Water Lilies<\/h2><p>1906 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://api.artic.edu/api/v1/artworks/16568\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">02<\/span><div><h2>Impression, Sunrise<\/h2><p>1872 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Monet_-_Impression%2C_Sunrise.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Monet_-_Impression%2C_Sunrise.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">03<\/span><div><h2>Woman with a Parasol — Madame Monet and Her Son<\/h2><p>1875 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Woman_with_a_Parasol_-_Madame_Monet_and_Her_Son_-_Google_Art_Project.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Woman_with_a_Parasol_-_Madame_Monet_and_Her_Son_-_Google_Art_Project.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">04<\/span><div><h2>Poppy Field<\/h2><p>1873 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Poppy_Field_-_Google_Art_Project.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.musee-orsay.fr/en/artworks/coquelicots-1010\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">05<\/span><div><h2>The Japanese Footbridge<\/h2><p>1899 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Japanese_Footbridge-Claude_Monet.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Japanese_Footbridge-Claude_Monet.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">06<\/span><div><h2>Water Lilies and Japanese Bridge<\/h2><p>1899 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Water_Lilies_and_Japanese_Bridge_-_Google_Art_Project.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Water_Lilies_and_Japanese_Bridge_-_Google_Art_Project.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><\/ul><p class=\"small\">Biography source: <a href=\"https://www.musee-orangerie.fr/en/collection/claude-monet-water-lilies\">Musée de l’Orangerie / institutional reading<\/a>. This independent design study has no affiliation with the named institutions.<\/p><\/main>", "title": "Image credits — Claude Monet"}, "extra": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Looking notes<\/p><h1>A pond without a horizon<\/h1><p class=\"intro\">A closer way into this collection.<\/p><\/header><a class=\"art-link \" href=\"#works/water-lilies\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/monet_water-lilies.webp\" srcset=\"../../art-city/artworks/monet_water-lilies.webp 500w, ../../art-city/artworks/monet_water-lilies.webp 960w, ../../art-city/artworks/monet_water-lilies.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Water Lilies. A pond fills the frame.\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/monet_water-lilies.webp\"><div class=\"image-fallback\"><span>Water Lilies<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Water Lilies<\/span><span class=\"art-group\">Water<\/span><\/span><span class=\"art-year\">1906<\/span><\/figcaption><\/figure><\/a><article class=\"reading-note\"><h2>Begin with the edge.<\/h2><p>Look around the painting before settling at its center. Is there a horizon? Where does one surface end and another begin?<\/p><p>Try naming three kinds of mark: a floating leaf, a reflection, a stroke that refuses to become either. The uncertainty is part of what makes the image worth staying with.<\/p><p class=\"small\">Original editorial looking exercise. Not an artist quotation.<\/p><\/article><\/main>", "title": "Looking notes — Claude Monet"}, "works/water-lilies": {"html": "<main id=\"main\" class=\"detail-page\" tabindex=\"-1\"><nav class=\"breadcrumb\" aria-label=\"Breadcrumb\"><a href=\"#index\">Claude Monet<\/a><span aria-hidden=\"true\">/<\/span><a href=\"#works\">Works<\/a><span aria-hidden=\"true\">/<\/span><span>01<\/span><\/nav><article class=\"detail-layout\"><div class=\"detail-image\" (() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);
  const all = (s, r=document) => [...r.querySelectorAll(s)];
  let lastFocus = null;
  let toastTimer;
  function announce(text) {
    const toast = qs('.toast');
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {toast.hidden=true;}, 5000);
  }
  function initialize(root=document) {
    // Failed art never silently swaps to an unrelated image.
    all('img[data-fallback]', root).forEach(img => {
      if (img.dataset.bound) return;
      img.dataset.bound='true';
      const failed = () => {
        if (!img.dataset.retried && img.dataset.fallback) {
          img.dataset.retried='true';
          img.removeAttribute('srcset');
          img.src=img.dataset.fallback;
        } else {
          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');
        }
      };
      img.addEventListener('error', failed);
      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});
      qs('[data-reset]',filters).addEventListener('click',()=>{search.value='';category.value='all';update();search.focus();});
    }
    all('[data-scroll-strip]',root).forEach(strip=>{
      if(strip.dataset.bound)return;
      strip.dataset.bound='true';
      const controls=qs(`[data-controls="${strip.id}"]`,root);
      if(!controls)return;
      const prev=qs('[data-prev]',controls), next=qs('[data-next]',controls);
      const sync=()=>{prev.disabled=strip.scrollLeft<3;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-3;};
      const move=dir=>strip.scrollBy({left:dir*(strip.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
      strip.addEventListener('scroll',sync,{passive:true});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(strip);
      sync();
    });
    const interval=qs('[data-interval]',root);
    if(interval&&!interval.dataset.bound){
      interval.dataset.bound='true';
      const surface=qs('.composition-stage',root),output=qs('[data-interval-output]',root);
      interval.addEventListener('input',()=>{surface.style.setProperty('--interval',interval.value);output.textContent=interval.value+'%';});
      qs('[data-reset-composition]',root)?.addEventListener('click',()=>{interval.value=45;interval.dispatchEvent(new Event('input'));});
    }
    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});
      qs('[data-reset-proportion]',root)?.addEventListener('click',()=>{split.value=36;split.dispatchEvent(new Event('input'));});
    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);
      function update(){preview.style.backgroundImage=`url("${pattern.value}")`;preview.style.backgroundSize=scale.value+'px auto';output.textContent=scale.value+' px';preview.setAttribute('aria-label',pattern.selectedOptions[0].text+' repeated at '+scale.value+' pixels');}
      pattern.addEventListener('change',update);scale.addEventListener('input',update);update();
    }
    const shuffle=qs('[data-shuffle]',root);
    if(shuffle&&!shuffle.dataset.bound){
      shuffle.dataset.bound='true';
      const board=qs('[data-shuffle-board]',root),original=all('.work-item',board);
      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
