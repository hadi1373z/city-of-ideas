ss=\"text-link\" href=\"#works\">Enter the sculpture room <span aria-hidden=\"true\">↗<\/span><\/a><\/div><div class=\"room-object\"><a class=\"art-link \" href=\"#works/thinker\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_thinker.webp\" srcset=\"../../art-city/artworks/rodin_thinker.webp 500w, ../../art-city/artworks/rodin_thinker.webp 960w, ../../art-city/artworks/rodin_thinker.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Thinker. A compact seated body carries a dense network of tensions: bent back, resting elbow, compressed limbs.\" width=\"3280\" height=\"4000\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/rodin_thinker.webp\"><div class=\"image-fallback\"><span>The Thinker<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Thinker<\/span><span class=\"art-group\">Figure<\/span><\/span><span class=\"art-year\">Modeled c. 1880; cast c. 1910<\/span><\/figcaption><\/figure><\/a><\/div><div class=\"room-label\"><span class=\"room-number\">I.<\/span><p>The body as a<br>complete landscape.<br><br>Six works.<br>Six points of view.<\/p><\/div><\/section><section class=\"room-sequence\"><a class=\"art-link \" href=\"#works/walking-man\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_walking-man.webp\" srcset=\"../../art-city/artworks/rodin_walking-man.webp 500w, ../../art-city/artworks/rodin_walking-man.webp 960w, ../../art-city/artworks/rodin_walking-man.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Walking Man. Without a head or arms, the figure concentrates attention on the spread of the legs and the weight of the torso.\" width=\"3178\" height=\"4000\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/rodin_walking-man.webp\"><div class=\"image-fallback\"><span>The Walking Man<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Walking Man<\/span><span class=\"art-group\">Fragment<\/span><\/span><span class=\"art-year\">Model completed before 1900; cast before 1914<\/span><\/figcaption><\/figure><\/a><div class=\"sequence-text\"><p class=\"eyebrow\">The fragment<\/p><h2>Not everything needs to be there.<\/h2><p>A torso or a single gesture can carry the force of an entire figure. The empty space around the work belongs to the encounter.<\/p><a class=\"text-link\" href=\"#works\">Look at the works <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/section><section class=\"room-sequence\"><div class=\"sequence-text\"><p class=\"eyebrow\">The making<\/p><h2>One form.<br>Several lives.<\/h2><p>Model, mold, and cast: why the date of a sculpture and the date of its bronze may be different.<\/p><a class=\"text-link\" href=\"#extra\">Read about materials <span aria-hidden=\"true\">↗<\/span><\/a><\/div><a class=\"art-link \" href=\"#works/eternal-spring\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_eternal-spring.webp\" srcset=\"../../art-city/artworks/rodin_eternal-spring.webp 500w, ../../art-city/artworks/rodin_eternal-spring.webp 960w, ../../art-city/artworks/rodin_eternal-spring.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Eternal Spring. Two figures make a continuous arrangement of torsos and limbs.\" width=\"4000\" height=\"3229\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/rodin_eternal-spring.webp\"><div class=\"image-fallback\"><span>Eternal Spring<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Eternal Spring<\/span><span class=\"art-group\">Pair<\/span><\/span><span class=\"art-year\">Modeled c. 1881; carved 1907<\/span><\/figcaption><\/figure><\/a><\/section><\/div><\/main>", "title": "Auguste Rodin — A room for sculpture"}, "works": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Selected works / 01–06<\/p><h1>The sculpture room.<\/h1><p class=\"intro\">A selected collection, not a catalogue raisonné. Open any work for its image, context, and source record.<\/p><\/header><form class=\"filter-bar\" data-filters role=\"search\"><label for=\"work-search\">Find a work<input id=\"work-search\" type=\"search\" name=\"search\" placeholder=\"Title, year, or subject\" autocomplete=\"off\"><\/label><label for=\"work-category\">Browse by theme<select id=\"work-category\" name=\"category\"><option value=\"all\">All themes<\/option><option value=\"Figure\">Figure<\/option><option value=\"Pair\">Pair<\/option><option value=\"Fragment\">Fragment<\/option><option value=\"Portrait\">Portrait<\/option><\/select><\/label><button type=\"button\" data-reset>Reset<\/button><output class=\"result-count\" data-result-count aria-live=\"polite\">6 of 6 works<\/output><\/form><section class=\"works-collection\" data-collection aria-label=\"Selected artworks\"><article class=\"work-item \" data-group=\"Figure\" data-stage=\"Figure\" data-search=\"The Thinker Modeled c. 1880; cast c. 1910 Figure A compact seated body carries a dense network of tensions: bent back, resting elbow, compressed limbs. Thought is made visible as physical effort.\" data-work=\"thinker\"><a class=\"art-link \" href=\"#works/thinker\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_thinker.webp\" srcset=\"../../art-city/artworks/rodin_thinker.webp 500w, ../../art-city/artworks/rodin_thinker.webp 960w, ../../art-city/artworks/rodin_thinker.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Thinker. A compact seated body carries a dense network of tensions: bent back, resting elbow, compressed limbs.\" width=\"3280\" height=\"4000\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/rodin_thinker.webp\"><div class=\"image-fallback\"><span>The Thinker<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Thinker<\/span><span class=\"art-group\">Figure<\/span><\/span><span class=\"art-year\">Modeled c. 1880; cast c. 1910<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Pair\" data-stage=\"Pair\" data-search=\"Eternal Spring Modeled c. 1881; carved 1907 Pair Two figures make a continuous arrangement of torsos and limbs. The work moves between the independent bodies and the single silhouette they create.\" data-work=\"eternal-spring\"><a class=\"art-link \" href=\"#works/eternal-spring\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_eternal-spring.webp\" srcset=\"../../art-city/artworks/rodin_eternal-spring.webp 500w, ../../art-city/artworks/rodin_eternal-spring.webp 960w, ../../art-city/artworks/rodin_eternal-spring.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Eternal Spring. Two figures make a continuous arrangement of torsos and limbs.\" width=\"4000\" height=\"3229\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/rodin_eternal-spring.webp\"><div class=\"image-fallback\"><span>Eternal Spring<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Eternal Spring<\/span><span class=\"art-group\">Pair<\/span><\/span><span class=\"art-year\">Modeled c. 1881; carved 1907<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Fragment\" data-stage=\"Fragment\" data-search=\"The Walking Man Model completed before 1900; cast before 1914 Fragment Without a head or arms, the figure concentrates attention on the spread of the legs and the weight of the torso. A step becomes the whole subject.\" data-work=\"walking-man\"><a class=\"art-link \" href=\"#works/walking-man\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_walking-man.webp\" srcset=\"../../art-city/artworks/rodin_walking-man.webp 500w, ../../art-city/artworks/rodin_walking-man.webp 960w, ../../art-city/artworks/rodin_walking-man.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Walking Man. Without a head or arms, the figure concentrates attention on the spread of the legs and the weight of the torso.\" width=\"3178\" height=\"4000\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/rodin_walking-man.webp\"><div class=\"image-fallback\"><span>The Walking Man<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Walking Man<\/span><span class=\"art-group\">Fragment<\/span><\/span><span class=\"art-year\">Model completed before 1900; cast before 1914<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Figure\" data-stage=\"Figure\" data-search=\"The Age of Bronze Modeled 1876; cast c. 1906 Figure An upright figure holds its arms in different registers. Its stance makes the body seem poised between waking, movement, and stillness.\" data-work=\"age-of-bronze\"><a class=\"art-link \" href=\"#works/age-of-bronze\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_age-of-bronze.webp\" srcset=\"../../art-city/artworks/rodin_age-of-bronze.webp 500w, ../../art-city/artworks/rodin_age-of-bronze.webp 960w, ../../art-city/artworks/rodin_age-of-bronze.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Age of Bronze. An upright figure holds its arms in different registers.\" width=\"2668\" height=\"4000\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/rodin_age-of-bronze.webp\"><div class=\"image-fallback\"><span>The Age of Bronze<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Age of Bronze<\/span><span class=\"art-group\">Figure<\/span><\/span><span class=\"art-year\">Modeled 1876; cast c. 1906<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Portrait\" data-stage=\"Portrait\" data-search=\"Madame X Modeled c. 1907 Portrait A portrait emerges from a broad mass of marble. Look at the change between the polished face and the less resolved stone surrounding it.\" data-work=\"madame-x\"><a class=\"art-link \" href=\"#works/madame-x\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_madame-x.webp\" srcset=\"../../art-city/artworks/rodin_madame-x.webp 500w, ../../art-city/artworks/rodin_madame-x.webp 960w, ../../art-city/artworks/rodin_madame-x.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Madame X. A portrait emerges from a broad mass of marble.\" width=\"2978\" height=\"3722\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/rodin_madame-x.webp\"><div class=\"image-fallback\"><span>Madame X<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Madame X<\/span><span class=\"art-group\">Portrait<\/span><\/span><span class=\"art-year\">Modeled c. 1907<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Fragment\" data-stage=\"Fragment\" data-search=\"The Hand of God Modeled c. 1896–1902; carved c. 1907 Fragment A large hand holds a small cluster of figures within the stone. The work sets the scale of the maker against the scale of what is being formed.\" data-work=\"hand-of-god\"><a class=\"art-link \" href=\"#works/hand-of-god\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_hand-of-god.webp\" srcset=\"../../art-city/artworks/rodin_hand-of-god.webp 500w, ../../art-city/artworks/rodin_hand-of-god.webp 960w, ../../art-city/artworks/rodin_hand-of-god.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Hand of God. A large hand holds a small cluster of figures within the stone.\" width=\"2969\" height=\"3722\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/rodin_hand-of-god.webp\"><div class=\"image-fallback\"><span>The Hand of God<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Hand of God<\/span><span class=\"art-group\">Fragment<\/span><\/span><span class=\"art-year\">Modeled c. 1896–1902; carved c. 1907<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — Auguste Rodin"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>Auguste Rodin<\/h1><p class=\"intro\">1840–1917 / Sculpture · drawing / Paris / Meudon<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/eternal-spring\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_eternal-spring.webp\" srcset=\"../../art-city/artworks/rodin_eternal-spring.webp 500w, ../../art-city/artworks/rodin_eternal-spring.webp 960w, ../../art-city/artworks/rodin_eternal-spring.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Eternal Spring. Two figures make a continuous arrangement of torsos and limbs.\" width=\"4000\" height=\"3229\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/rodin_eternal-spring.webp\"><div class=\"image-fallback\"><span>Eternal Spring<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Eternal Spring<\/span><span class=\"art-group\">Pair<\/span><\/span><span class=\"art-year\">Modeled c. 1881; carved 1907<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>Auguste Rodin was a French sculptor whose modeled surfaces and expressive figures changed the language of sculpture. His practice moved between small studies, fragments, and monumental works.<\/p><p>A single form may exist in plaster, marble, and bronze, sometimes at several scales. This site therefore distinguishes a sculptural model from a particular cast or carving rather than presenting one set of measurements as universal.<\/p><h2>A way of looking<\/h2><p>A hand, a step, a bend of the torso: gesture carries the work. Look at the spaces around the body as carefully as the body itself.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://www.musee-rodin.fr/en/auguste-rodin\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — Auguste Rodin"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1877<\/span><div><h2>The Age of Bronze<\/h2><p>The figure was exhibited in Brussels and Paris.<\/p><a href=\"https://www.musee-rodin.fr/en/musee/collections/oeuvres/age-bronze\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1880<\/span><div><h2>The Gates of Hell<\/h2><p>Rodin received the commission that generated many independent figures.<\/p><a href=\"https://www.musee-rodin.fr/en/musee/collections/oeuvres/gates-hell\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1900<\/span><div><h2>Pavillon de l’Alma<\/h2><p>Rodin presented an extensive exhibition of his work in Paris.<\/p><a href=\"https://www.musee-rodin.fr/en/auguste-rodin\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — Auguste Rodin"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1>Continue the conversation.<\/h1><p class=\"intro\">For collection research, visiting information, and image requests, contact the relevant institution through its official website.<\/p><\/header><div class=\"contact-grid\"><section><h2>Go to the source.<\/h2><a class=\"resource-link\" href=\"https://www.musee-rodin.fr/en\" target=\"_blank\" rel=\"noopener noreferrer\">Musée Rodin ↗<span>Official institution · collection and contact channels<\/span><\/a><a class=\"resource-link\" href=\"https://www.musee-rodin.fr/en/auguste-rodin\" target=\"_blank\" rel=\"noopener noreferrer\">Biography &amp; research ↗<span>Background reading and further context<\/span><\/a><a class=\"resource-link\" href=\"#credits\">Image credits &amp; sources →<span>Artwork records, attributions, and reuse information<\/span><\/a><p class=\"editorial-note\">No representation, affiliation, authentication service, artwork sale, or estate contact is implied. This site does not accept messages on behalf of the artist.<\/p><\/section><section><h2>Prepare an inquiry.<\/h2><p class=\"small\" style=\"margin-bottom:25px\">Save a plain-text draft to send through an institution’s official channel. Nothing is transmitted or stored by this website.<\/p><form class=\"draft-form\" data-artist=\"Auguste Rodin\"><label for=\"inquiry-subject\">Subject<input id=\"inquiry-subject\" name=\"subject\" required maxlength=\"160\" placeholder=\"Question about a work or collection\"><\/label><label for=\"inquiry-message\">Your question<textarea id=\"inquiry-message\" name=\"message\" required minlength=\"10\" maxlength=\"5000\" placeholder=\"Include the artwork title, date, and what you would like to know.\"><\/textarea><\/label><button type=\"submit\">Download inquiry draft ↓<\/button><p class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/p><\/form><\/section><\/div><\/main>", "title": "Contact & resources — Auguste Rodin"}, "credits": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Sources &amp; image credits<\/p><h1>The record behind the image.<\/h1><p class=\"intro\">Artwork metadata and images are linked individually. Descriptions and looking notes are original editorial writing; no invented artist quotations are used.<\/p><\/header><p class=\"extra-intro small\">Artwork reproductions load from Wikimedia Commons or the linked institution. Reuse conditions attach to individual files. Photographs of sculptures can have separate copyrights from the sculpture itself. Consult each source record before republication. Cover images may be cropped; detail pages show the complete supplied image.<\/p><ul class=\"credits-list\"><li><span class=\"meta\">01<\/span><div><h2>The Thinker<\/h2><p>Modeled c. 1880; cast c. 1910 · Bronze<br>Auguste Rodin; photograph: Joseph Coscia / The Metropolitan Museum of Art, Open Access (CC0 1.0); via Wikimedia Commons.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:The_Thinker_MET_DP-13618-011.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.metmuseum.org/art/collection/search/191811\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">02<\/span><div><h2>Eternal Spring<\/h2><p>Modeled c. 1881; carved 1907 · Marble<br>Auguste Rodin; photograph: Joseph Coscia / The Metropolitan Museum of Art, Open Access (CC0 1.0); via Wikimedia Commons.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Eternal_Spring_MET_DP-13618-015.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.metmuseum.org/art/collection/search/193438\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">03<\/span><div><h2>The Walking Man<\/h2><p>Model completed before 1900; cast before 1914 · Bronze, green patina<br>Auguste Rodin; reproduction: The Metropolitan Museum of Art, Open Access (CC0 1.0); via Wikimedia Commons.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:The_Walking_Man_(L%27homme_qui_marche)_MET_131267.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.metmuseum.org/art/collection/search/198565\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">04<\/span><div><h2>The Age of Bronze<\/h2><p>Modeled 1876; cast c. 1906 · Bronze<br>Auguste Rodin; photograph: Joseph Coscia / The Metropolitan Museum of Art, Open Access (CC0 1.0); via Wikimedia Commons.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:The_Age_of_Bronze_(L%27Age_d%27airain)_MET_DP-13618-001.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.metmuseum.org/art/collection/search/189265\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">05<\/span><div><h2>Madame X<\/h2><p>Modeled c. 1907 · Marble<br>Auguste Rodin; reproduction: The Metropolitan Museum of Art, Open Access (CC0 1.0); via Wikimedia Commons.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Madame_X_MET_183136.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.metmuseum.org/art/collection/search/191808\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">06<\/span><div><h2>The Hand of God<\/h2><p>Modeled c. 1896–1902; carved c. 1907 · Marble<br>Auguste Rodin; reproduction: The Metropolitan Museum of Art, Open Access (CC0 1.0); via Wikimedia Commons.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:The_Hand_of_God_MET_131221.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.metmuseum.org/art/collection/search/191046\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><\/ul><p class=\"small\">Biography source: <a href=\"https://www.musee-rodin.fr/en/auguste-rodin\">Musée Rodin / institutional reading<\/a>. This independent design study has no affiliation with the named institutions.<\/p><\/main>", "title": "Image credits — Auguste Rodin"}, "extra": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Materials<\/p><h1>Model, mold, cast<\/h1><p class=\"intro\">A closer way into this collection.<\/p><\/header><div class=\"about-grid\"><div class=\"prose\"><h2>1. The model<\/h2><p>The sculptural form begins in a material that can be worked directly. A date attached to a sculpture often refers to the conception or modeling of the work.<\/p><h2>2. The translation<\/h2><p>A mold allows the form to be translated into another material. Scale, surface, and production history matter when identifying a particular object.<\/p><h2>3. The cast<\/h2><p>A bronze may have been cast years after the original model. Its own date and provenance belong in its record, not beneath a universal date for every version.<\/p><p class=\"source-note\">For object-specific materials, casting histories, and dimensions, consult the <a href=\"https://www.musee-rodin.fr/en\">Musée Rodin<\/a> collection.<\/p><\/div><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/walking-man\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/rodin_walking-man.webp\" srcset=\"../../art-city/artworks/rodin_walking-man.webp 500w, ../../art-city/artworks/rodin_walking-man.webp 960w, ../../art-city/artworks/rodin_walking-man.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Walking Man. Without a head or arms, the figure concentrates attention on the spread of the legs and the weight of the torso.\" width=\"3178\" height=\"4000\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/rodin_walking-man.webp\"><div class=\"image-fallback\"><span>The Walking Man<br>Image unavailable on this (() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);
  const all = (s, r=document) => [...r.querySelectorAll(s)];
  let lastFocus = null;
  let toastTimer;
  function announce(text) {
    const toast = qs('.toast');
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {toast.hidden=true;}, 5000);
  }
  function initialize(root=document) {
    // Failed art never silently swaps to an unrelated image.
    all('img[data-fallback]', root).forEach(img => {
      if (img.dataset.bound) return;
      img.dataset.bound='true';
      const failed = () => {
        if (!img.dataset.retried && img.dataset.fallback) {
          img.dataset.retried='true';
          img.removeAttribute('srcset');
          img.src=img.dataset.fallback;
        } else {
          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');
        }
      };
      img.addEventListener('error', failed);
      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});
      qs('[data-reset]',filters).addEventListener('click',()=>{search.value='';category.value='all';update();search.focus();});
    }
    all('[data-scroll-strip]',root).forEach(strip=>{
      if(strip.dataset.bound)return;
      strip.dataset.bound='true';
      const controls=qs(`[data-controls="${strip.id}"]`,root);
      if(!controls)return;
      const prev=qs('[data-prev]',controls), next=qs('[data-next]',controls);
      const sync=()=>{prev.disabled=strip.scrollLeft<3;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-3;};
      const move=dir=>strip.scrollBy({left:dir*(strip.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
      strip.addEventListener('scroll',sync,{passive:true});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(strip);
      sync();
    });
    const interval=qs('[data-interval]',root);
    if(interval&&!interval.dataset.bound){
      interval.dataset.bound='true';
      const surface=qs('.composition-stage',root),output=qs('[data-interval-output]',root);
      interval.addEventListener('input',()=>{surface.style.setProperty('--interval',interval.value);output.textContent=interval.value+'%';});
      qs('[data-reset-composition]',root)?.addEventListener('click',()=>{interval.value=45;interval.dispatchEvent(new Event('input'));});
    }
    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});
      qs('[data-reset-proportion]',root)?.addEventListener('click',()=>{split.value=36;split.dispatchEvent(new Event('input'));});
    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);
      function update(){preview.style.backgroundImage=`url("${pattern.value}")`;preview.style.backgroundSize=scale.value+'px auto';output.textContent=scale.value+' px';preview.setAttribute('aria-label',pattern.selectedOptions[0].text+' repeated at '+scale.value+' pixels');}
      pattern.addEventListener('change',update);scale.addEventListener('input',update);update();
    }
    const shuffle=qs('[data-shuffle]',root);
    if(shuffle&&!shuffle.dataset.bound){
      shuffle.dataset.bound='true';
      const board=qs('[data-shuffle-board]',root),original=all('.work-item',board);
      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
