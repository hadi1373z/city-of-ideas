ky / 1866–1944<\/p><h1>FORM<br>HAS A<br>SOUND.<\/h1><p>Paintings arranged as encounters between pressure, interval, and color.<\/p><a class=\"text-link\" href=\"#works\">Enter the collection <span aria-hidden=\"true\">↗<\/span><\/a><\/div><div class=\"score-image\"><span class=\"disc\" aria-hidden=\"true\"><\/span><a class=\"art-link \" href=\"#works/composition-eight\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_composition-eight.webp\" alt=\"Composition VIII. Circles, triangles, arcs, and diagonals share a pale field.\" width=\"1090\" height=\"755\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/kandinsky_composition-eight.webp\"><div class=\"image-fallback\"><span>Composition VIII<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition VIII<\/span><span class=\"art-group\">Geometry<\/span><\/span><span class=\"art-year\">1923<\/span><\/figcaption><\/figure><\/a><span class=\"fine-line\" aria-hidden=\"true\"><\/span><span class=\"index-stamp\" aria-hidden=\"true\">01—06<\/span><\/div><\/section><section class=\"score-index\"><a href=\"#works\"><span class=\"number\">01 / LOOK<\/span><h2>Six compositions.<\/h2><p>From densely layered gesture to a geometry of intervals.<\/p><\/a><a href=\"#about\"><span class=\"number\">02 / READ<\/span><h2>Beyond the object.<\/h2><p>Biography, context, and a way into abstraction.<\/p><\/a><a href=\"#extra\"><span class=\"number\">03 / EXPERIMENT<\/span><h2>Move one form.<\/h2><p>An interactive design study in balance and visual pressure.<\/p><\/a><\/section><section class=\"score-secondary\" aria-label=\"Two more paintings\"><a class=\"art-link \" href=\"#works/several-circles\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_several-circles.webp\" srcset=\"../../art-city/artworks/kandinsky_several-circles.webp 500w, ../../art-city/artworks/kandinsky_several-circles.webp 960w, ../../art-city/artworks/kandinsky_several-circles.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Several Circles. Translucent discs overlap against a dark ground.\" width=\"1800\" height=\"1833\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/kandinsky_several-circles.webp\"><div class=\"image-fallback\"><span>Several Circles<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Several Circles<\/span><span class=\"art-group\">Geometry<\/span><\/span><span class=\"art-year\">1926<\/span><\/figcaption><\/figure><\/a><a class=\"art-link \" href=\"#works/composition-seven\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_composition-seven.webp\" alt=\"Composition VII. A dense current of marks resists a single focal point.\" width=\"1000\" height=\"657\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/kandinsky_composition-seven.webp\"><div class=\"image-fallback\"><span>Composition VII<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition VII<\/span><span class=\"art-group\">Gesture<\/span><\/span><span class=\"art-year\">1913<\/span><\/figcaption><\/figure><\/a><\/section><\/div><\/main>", "title": "Wassily Kandinsky — A score for the eye"}, "works": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Selected works / 01–06<\/p><h1>SIX COMPOSITIONS.<\/h1><p class=\"intro\">A selected collection, not a catalogue raisonné. Open any work for its image, context, and source record.<\/p><\/header><form class=\"filter-bar\" data-filters role=\"search\"><la " data-work=\"composition-seven\"><a class=\"art-link \" href=\"#works/composition-seven\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_composition-seven.webp\" alt=\"Composition VII. A dense current of marks resists a single focal point.\" width=\"1000\" height=\"657\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/kandinsky_composition-seven.webp\"><div class=\"image-fallback\"><span>Composition VII<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition VII<\/span><span class=\"art-group\">Gesture<\/span><\/span><span class=\"art-year\">1913<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Geometry\" data-stage=\"Geometry\" data-search=\"Yellow–Red–Blue 1925 Geometry A yellow structure and a large blue circle pull in different directions. Lines cross the space between them like another layer of thought.\" data-work=\"yellow-red-blue\"><a class=\"art-link \" href=\"#works/yellow-red-blue\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_yellow-red-blue.webp\" srcset=\"../../art-city/artworks/kandinsky_yellow-red-blue.webp 500w, ../../art-city/artworks/kandinsky_yellow-red-blue.webp 960w, ../../art-city/artworks/kandinsky_yellow-red-blue.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Yellow–Red–Blue. A yellow structure and a large blue circle pull in different directions.\" width=\"4780\" height=\"3074\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/kandinsky_yellow-red-blue.webp\"><div class=\"image-fallback\"><span>Yellow–Red–Blue<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Yellow–Red–Blue<\/span><span class=\"art-group\">Geometry<\/span><\/span><span class=\"art-year\">1925<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Geometry\" data-stage=\"Geometry\" data-search=\"Several Circles 1926 Geometry Translucent discs overlap against a dark ground. Color becomes luminous at their edges, suggesting depth without a conventional setting.\" data-work=\"several-circles\"><a class=\"art-link \" href=\"#works/several-circles\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_several-circles.webp\" srcset=\"../../art-city/artworks/kandinsky_several-circles.webp 500w, ../../art-city/artworks/kandinsky_several-circles.webp 960w, ../../art-city/artworks/kandinsky_several-circles.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Several Circles. Translucent discs overlap against a dark ground.\" width=\"1800\" height=\"1833\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/kandinsky_several-circles.webp\"><div class=\"image-fallback\"><span>Several Circles<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Several Circles<\/span><span class=\"art-group\">Geometry<\/span><\/span><span class=\"art-year\">1926<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Geometry\" data-stage=\"Geometry\" data-search=\"Black and Violet 1923 Geometry Large dark forms are held in tension by fine lines and small accents. The open background is an active part of the arrangement.\" data-work=\"black-and-violet\"><a class=\"art-link \" href=\"#works/black-and-violet\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_black-and-violet.webp\" srcset=\"../../art-city/artworks/kandinsky_black-and-violet.webp 500w, ../../art-city/artworks/kandinsky_black-and-violet.webp 960w, ../../art-city/artworks/kandinsky_black-and-violet.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Black and Violet. Large dark forms are held in tension by fine lines and small accents.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/kandinsky_black-and-violet.webp\"><div class=\"image-fallback\"><span>Black and Violet<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Black and Violet<\/span><span class=\"art-group\">Geometry<\/span><\/span><span class=\"art-year\">1923<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Gesture\" data-stage=\"Gesture\" data-search=\"Study for Composition VII, No. 2 1913 Gesture An expansive study in which color masses gather, dissolve, and change direction. Its loose passages make the process of composition visible.\" data-work=\"study-seven\"><a class=\"art-link \" href=\"#works/study-seven\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_study-seven.webp\" srcset=\"../../art-city/artworks/kandinsky_study-seven.webp 500w, ../../art-city/artworks/kandinsky_study-seven.webp 960w, ../../art-city/artworks/kandinsky_study-seven.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Study for Composition VII, No. 2. An expansive study in which color masses gather, dissolve, and change direction.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/kandinsky_study-seven.webp\"><div class=\"image-fallback\"><span>Study for Composition VII, No. 2<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Study for Composition VII, No. 2<\/span><span class=\"art-group\">Gesture<\/span><\/span><span class=\"art-year\">1913<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — Wassily Kandinsky"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>Wassily Kandinsky<\/h1><p class=\"intro\">1866–1944 / Painting · works on paper / Moscow / Munich / Dessau / Paris<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/composition-seven\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/kandinsky_composition-seven.webp\" alt=\"Composition VII. A dense current of marks resists a single focal point.\" width=\"1000\" height=\"657\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/kandinsky_composition-seven.webp\"><div class=\"image-fallback\"><span>Composition VII<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition VII<\/span><span class=\"art-group\">Gesture<\/span><\/span><span class=\"art-year\">1913<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>Wassily Kandinsky was a painter and theorist associated with the development of abstract art. His work moved between expressive, densely layered compositions and a more geometric vocabulary of circles, lines, and planes.<\/p><p>He was a central figure in Der Blaue Reiter and later taught at the Bauhaus. His paintings invite the viewer to attend to relationships within a composition rather than search only for recognizable objects.<\/p><h2>A way of looking<\/h2><p>Read these paintings as arrangements of visual forces. A circle can anchor the field; a diagonal can disturb it. The important event may be the interval between them.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://www.guggenheim.org/artwork/artist/vasily-kandinsky\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — Wassily Kandinsky"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1911<\/span><div><h2>Der Blaue Reiter<\/h2><p>The Munich circle provided a setting for exchanges across painting and music.<\/p><a href=\"https://www.guggenheim.org/artwork/artist/vasily-kandinsky\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1922–1933<\/span><div><h2>Bauhaus years<\/h2><p>Kandinsky taught at the Bauhaus in Germany.<\/p><a href=\"https://www.tate.org.uk/art/artists/wassily-kandinsky-1382\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1933–1944<\/span><div><h2>Paris years<\/h2><p>He settled in Neuilly-sur-Seine.<\/p><a href=\"https://www.guggenheim.org/artwork/artist/vasily-kandinsky\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — Wassily Kandinsky"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1>Continue the conversation.<\/h1><p class=\"intro\">For collection research, visiting information, and image requests, contact the relevant institution through its official website.<\/p><\/header><div class=\"contact-grid\"><section><h2>Go to the source.<\/h2><a class=\"resource-link\" href=\"https://www.guggenheim.org/artwork/artist/vasily-kandinsky\" target=\"_blank\" rel=\"noopener noreferrer\">Solomon R. Guggenheim Museum ↗<span>Official institution · collection and contact channels<\/span><\/a><a class=\"resource-link\" href=\"https://www.guggenheim.org/artwork/artist/vasily-kandinsky\" target=\"_blank\" rel=\"noopener noreferrer\">Biography &amp; research ↗<span>Background reading and further context<\/span><\/a><a class=\"resource-link\" href=\"#credits\">Image credits &amp; sources →<span>Artwork records, attributions, and reuse information<\/span><\/a><p class=\"editorial-note\">No representation, affiliation, authentication service, artwork sale, or estate contact is implied. This site does not accept messages on behalf of the artist.<\/p><\/section><section><h2>Prepare an inquiry.<\/h2><p class=\"small\" style=\"margin-bottom:25px\">Save a plain-text draft to send through an institution’s official channel. Nothing is transmitted or stored by this website.<\/p><form class=\"draft-form\" data-artist=\"Wassily Kandinsky\"><label for=\"inquiry-subject\">Subject<input id=\"inquiry-subject\" name=\"subject\" required maxlength=\"160\" placeholder=\"Question about a work or collection\"><\/label><label for=\"inquiry-message\">Your question<textarea id=\"inquiry-message\" name=\"message\" required minlength=\"10\" maxlength=\"5000\" placeholder=\"Include the artwork title, date, and what you would like to know.\"><\/textarea><\/label><button type=\"submit\">Download inquiry draft ↓<\/button><p class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/p><\/form><\/section><\/div><\/main>", "title": "Contact & resources — Wassily Kandinsky"}, "credits": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Sources &amp; image credits<\/p><h1>The record behind the image.<\/h1><p class=\"intro\">Artwork metadata and images are linked individually. Descriptions and looking notes are original editorial writing; no invented artist quotations are used.<\/p><\/header><p class=\"extra-intro small\">Artwork reproductions load from Wikimedia Commons or the linked institution. Reuse conditions attach to individual files. Photographs of sculptures can have separate copyrights from the sculpture itself. Consult each source record before republication. Cover images may be cropped; detail pages show the complete supplied image.<\/p><ul class=\"credits-list\"><li><span class=\"meta\">01<\/span><div><h2>Composition VIII<\/h2><p>1923 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Vassily_Kandinsky%2C_1923_-_Composition_8%2C_huile_sur_toile%2C_140_cm_x_201_cm%2C_Mus%C3%A9e_Guggenheim%2C_New_York.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Vassily_Kandinsky%2C_1923_-_Composition_8%2C_huile_sur_toile%2C_140_cm_x_201_cm%2C_Mus%C3%A9e_Guggenheim%2C_New_York.jpg\" target=\"_blank\" rel=\ er, dissolve, and change direction. Its loose passages make the process of composition visible.<\/p><dl class=\"specs\"><div><dt>Artist<\/dt><dd>Wassily Kandinsky<\/dd><\/div><div><dt>Date<\/dt><dd>1913<\/dd><\/div><div><dt>Medium<\/dt><dd>Oil on canvas<\/dd><\/div><div><dt>Dimensions<\/dt><dd>100 × 140 cm<\/dd><\/div><div><dt>Collection<\/dt><dd>Lenbachhaus<\/dd><\/div><\/dl><div class=\"detail-actions\"><button type=\"button\" data-citation=\"Wassily Kandinsky, Study for Composition VII, No. 2, 1913. Oil on canvas. Lenbachhaus. https://commons.wikimedia.org/wiki/File:Wassily_Kandinsky_-_Studie_zu_Komposition_VII_(Entwurf_2)_-_GMS_64_-_Lenbachhaus.jpg\">Copy citation<\/button><a class=\"text-link small\" href=\"https://commons.wikimedia.org/wiki/File:Wassily_Kandinsky_-_Studie_zu_Komposition_VII_(Entwurf_2)_-_GMS_64_-_Lenbachhaus.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Source record ↗<\/a><\/div><div class=\"source-note\">Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<br><a href=\"https://commons.wikimedia.org/wiki/File:Wassily_Kandinsky_-_Studie_zu_Komposition_VII_(Entwurf_2)_-_GMS_64_-_Lenbachhaus.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image, attribution &amp; reuse record ↗<\/a><details style=\"margin-top:15px\"><summary>Read the citation<\/summary><p style=\"overflow-wrap:anywhere;margin-top:10px\">Wassily Kandinsky, Study for Composition VII, No. 2, 1913. Oil on canvas. Lenbachhaus. https://commons.wikimedia.org/wiki/File:Wassily_Kandinsky_-_Studie_zu_Komposition_VII_(Entwurf_2)_-_GMS_64_-_Lenbachhaus.jpg<\/p><\/details><\/div><\/div><\/article><nav class=\"adjacent-works\" aria-label=\"Adjacent artworks\"><a href=\"#works/black-and-violet\"><span>← Previous work<\/span>Black and Violet<\/a><a href=\"#works/composition-eight\"><span>Next work →<\/span>Composition VIII<\/a><\/nav><\/main>", "title": "Study for Composition VII, No. 2 — Wassily Kandinsky"}}</script><script>/* Framework-free enhancements. Content and navigation also work without JS. */
(() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);
  const all = (s, r=document) => [...r.querySelectorAll(s)];
  let lastFocus = null;
  let toastTimer;
  function announce(text) {
    const toast = qs('.toast');
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {toast.hidden=true;}, 5000);
  }
  function initialize(root=document) {
    // Failed art never silently swaps to an unrelated image.
    all('img[data-fallback]', root).forEach(img => {
      if (img.dataset.bound) return;
      img.dataset.bound='true';
      const failed = () => {
        if (!img.dataset.retried && img.dataset.fallback) {
          img.dataset.retried='true';
          img.removeAttribute('srcset');
          img.src=img.dataset.fallback;
        } else {
          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');
        }
      };
      img.addEventListener('error', failed);
      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});
      qs('[data-reset]',filters).addEventListener('click',()=>{search.value='';category.value='all';update();search.focus();});
    }
    all('[data-scroll-strip]',root).forEach(strip=>{
      if(strip.dataset.bound)return;
      strip.dataset.bound='true';
      const controls=qs(`[data-controls="${strip.id}"]`,root);
      if(!controls)return;
      const prev=qs('[data-prev]',controls), next=qs('[data-next]',controls);
      const sync=()=>{prev.disabled=strip.scrollLeft<3;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-3;};
      const move=dir=>strip.scrollBy({left:dir*(strip.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
      strip.addEventListener('scroll',sync,{passive:true});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(strip);
      sync();
    });
    const interval=qs('[data-interval]',root);
    if(interval&&!interval.dataset.bound){
      interval.dataset.bound='true';
      const surface=qs('.composition-stage',root),output=qs('[data-interval-output]',root);
      interval.addEventListener('input',()=>{surface.style.setProperty('--interval',interval.value);output.textContent=interval.value+'%';});
      qs('[data-reset-composition]',root)?.addEventListener('click',()=>{interval.value=45;interval.dispatchEvent(new Event('input'));});
    }
    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});
      qs('[data-reset-proportion]',root)?.addEventListener('click',()=>{split.value=36;split.dispatchEvent(new Event('input'));});
    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);
      function update(){preview.style.backgroundImage=`url("${pattern.value}")`;preview.style.backgroundSize=scale.value+'px auto';output.textContent=scale.value+' px';preview.setAttribute('aria-label',pattern.selectedOptions[0].text+' repeated at '+scale.value+' pixels');}
      pattern.addEventListener('change',update);scale.addEventListener('input',update);update();
    }
    const shuffle=qs('[data-shuffle]',root);
    if(shuffle&&!shuffle.dataset.bound){
      shuffle.dataset.bound='true';
      const board=qs('[data-shuffle-board]',root),original=all('.work-item',board);
      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
