\" href=\"#works/sunflowers\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/van-gogh_sunflowers.webp\" srcset=\"../../art-city/artworks/van-gogh_sunflowers.webp 500w, ../../art-city/artworks/van-gogh_sunflowers.webp 960w, ../../art-city/artworks/van-gogh_sunflowers.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Sunflowers (Munich version). Petals, seeds, and leaves give each flower a different texture.\" width=\"3888\" height=\"5082\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/van-gogh_sunflowers.webp\"><div class=\"image-fallback\"><span>Sunflowers (Munich version)<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Sunflowers (Munich version)<\/span><span class=\"art-group\">Still life<\/span><\/span><span class=\"art-year\">1888<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Night\" data-stage=\"Night\" data-search=\"Starry Night over the Rhône 1888 Night Points of light stretch into the river. Above and below the horizon, short yellow strokes turn darkness into a sequence of reflections.\" data-work=\"rhone\"><a class=\"art-link \" href=\"#works/rhone\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/van-gogh_rhone.webp\" srcset=\"../../art-city/artworks/van-gogh_rhone.webp 500w, ../../art-city/artworks/van-gogh_rhone.webp 960w, ../../art-city/artworks/van-gogh_rhone.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Starry Night over the Rhône. Points of light stretch into the river.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/van-gogh_rhone.webp\"><div class=\"image-fallback\"><span>Starry Night over the Rhône<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Starry Night over the Rhône<\/span><span class=\"art-group\">Night<\/span><\/span><span class=\"art-year\">1888<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Interior\" data-stage=\"Interior\" data-search=\"The Bedroom 1888 Interior The room is built from strongly outlined furniture and tilted planes. Empty space around the bed becomes as distinctive as the objects themselves.\" data-work=\"bedroom\"><a class=\"art-link \" href=\"#works/bedroom\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/van-gogh_bedroom.webp\" srcset=\"../../art-city/artworks/van-gogh_bedroom.webp 500w, ../../art-city/artworks/van-gogh_bedroom.webp 960w, ../../art-city/artworks/van-gogh_bedroom.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Bedroom. The room is built from strongly outlined furniture and tilted planes.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/van-gogh_bedroom.webp\"><div class=\"image-fallback\"><span>The Bedroom<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Bedroom<\/span><span class=\"art-group\">Interior<\/span><\/span><span class=\"art-year\">1888<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Landscape\" data-stage=\"Landscape\" data-search=\"Wheatfield with Crows 1890 Landscape Paths interrupt the gold of the field while dark birds mark the sky. The wide format places the viewer close to an unresolved stretch of land.\" data-work=\"wheatfield\"><a class=\"art-link \" href=\"#works/wheatfield\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/van-gogh_wheatfield.webp\" srcset=\"../../art-city/artworks/van-gogh_wheatfield.webp 500w, ../../art-city/artworks/van-gogh_wheatfield.webp 960w, ../../art-city/artworks/van-gogh_wheatfield.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Wheatfield with Crows. Paths interrupt the gold of the field while dark birds mark the sky.\" width=\"3508\" height=\"1669\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/van-gogh_wheatfield.webp\"><div class=\"image-fallback\"><span>Wheatfield with Crows<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Wheatfield with Crows<\/span><span class=\"art-group\">Landscape<\/span><\/span><span class=\"art-year\">1890<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — Vincent van Gogh"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>Vincent van Gogh<\/h1><p class=\"intro\">1853–1890 / Painting · drawing · letters / The Netherlands / France<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/almond-blossom\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/van-gogh_almond-blossom.webp\" srcset=\"../../art-city/artworks/van-gogh_almond-blossom.webp 500w, ../../art-city/artworks/van-gogh_almond-blossom.webp 960w, ../../art-city/artworks/van-gogh_almond-blossom.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Almond Blossom. Pale blossoms spread across an uninterrupted blue.\" width=\"3139\" height=\"2480\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/van-gogh_almond-blossom.webp\"><div class=\"image-fallback\"><span>Almond Blossom<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Almond Blossom<\/span><span class=\"art-group\">Growth<\/span><\/span><span class=\"art-year\">1890<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>Vincent van Gogh was a Dutch painter and draughtsman. His working life took him from the Netherlands to Paris, Arles, Saint-Rémy, and Auvers-sur-Oise.<\/p><p>Paintings and letters reveal an artist concerned with practice: choosing subjects, testing color, looking at other artists, and finding a language for everyday experience. This selection places familiar works beside the decisions visible in their surfaces.<\/p><h2>A way of looking<\/h2><p>A room, a flowering branch, a field, a night sky. The subjects are ordinary; their painted surfaces are not. Follow the direction of a brushstroke before giving the scene a name.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://www.vangoghmuseum.nl/en/art-and-stories/vincents-life-1853-1890\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — Vincent van Gogh"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1886–1888<\/span><div><h2>Paris<\/h2><p>Van Gogh lived and worked in Paris before moving south.<\/p><a href=\"https://www.vangoghmuseum.nl/en/art-and-stories/vincents-life-1853-1890\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1888–1889<\/span><div><h2>Arles<\/h2><p>A period of intense work on landscapes, portraits, and interiors.<\/p><a href=\"https://www.vangoghmuseum.nl/en/art-and-stories/vincents-life-1853-1890\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1889–1890<\/span><div><h2>Saint-Rémy and Auvers<\/h2><p>The places of his final working years.<\/p><a href=\"https://www.vangoghmuseum.nl/en/art-and-stories/vincents-life-1853-1890\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — Vincent van Gogh"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1>Continue the conversation.<\/h1><p class=\"intro\">For collection research, visiting information, and image requests, contact the relevant institution through its official website.<\/p><\/header><div class=\"contact-grid\"><section><h2>Go to the source.<\/h2><a class=\"resource-link\" href=\"https://www.vangoghmuseum.nl/en\" target=\"_blank\" rel=\"noopener noreferrer\">Van Gogh Museum ↗<span>Official institution · collection and contact channels<\/span><\/a><a class=\"resource-link\" href=\"https://www.vangoghmuseum.nl/en/art-and-stories/vincents-life-1853-1890\" target=\"_blank\" rel=\"noopener noreferrer\">Biography &amp; research ↗<span>Background reading and further context<\/span><\/a><a class=\"resource-link\" href=\"#credits\">Image credits &amp; sources →<span>Artwork records, attributions, and reuse information<\/span><\/a><p class=\"editorial-note\">No representation, affiliation, authentication service, artwork sale, or estate contact is implied. This site does not accept messages on behalf of the artist.<\/p><\/section><section><h2>Prepare an inquiry.<\/h2><p class=\"small\" style=\"margin-bottom:25px\">Save a plain-text draft to send through an institution’s official channel. Nothing is transmitted or stored by this website.<\/p><form class=\"draft-form\" data-artist=\"Vincent van Gogh\"><label for=\"inquiry-subject\">Subject<input id=\"inquiry-subject\" name=\"subject\" required maxlength=\"160\" placeholder=\"Question about a work or collection\"><\/label><label for=\"inquiry-message\">Your question<textarea id=\"inquiry-message\" name=\"message\" required minlength=\"10\" maxlength=\"5000\" placeholder=\"Include the artwork title, date, and what you would like to know.\"><\/textarea><\/label><button type=\"submit\">Download inquiry draft ↓<\/button><p class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/p><\/form><\/section><\/div><\/main>", "title": "Contact & resources — Vincent van Gogh"}, "credits": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Sources &amp; image credits<\/p><h1>The record behind the image.<\/h1><p class=\"intro\">Artwork metadata and images are linked individually. Descriptions and looking notes are original editorial writing; no invented artist quotations are used.<\/p><\/header><p class=\"extra-intro small\">Artwork reproductions load from Wikimedia Commons or the linked in  Wheatfield with Crows, 1890. Oil on canvas. Van Gogh Museum. https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_Wheatfield_with_crows_-_Google_Art_Project.jpg<\/p><\/details><\/div><\/div><\/article><nav class=\"adjacent-works\" aria-label=\"Adjacent artworks\"><a href=\"#works/bedroom\"><span>← Previous work<\/span>The Bedroom<\/a><a href=\"#works/starry-night\"><span>Next work →<\/span>The Starry Night<\/a><\/nav><\/main>", "title": "Wheatfield with Crows — Vincent van Gogh"}}</script><script>/* Framework-free enhancements. Content and navigation also work without JS. */
(() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);
  const all = (s, r=document) => [...r.querySelectorAll(s)];
  let lastFocus = null;
  let toastTimer;
  function announce(text) {
    const toast = qs('.toast');
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {toast.hidden=true;}, 5000);
  }
  function initialize(root=document) {
    // Failed art never silently swaps to an unrelated image.
    all('img[data-fallback]', root).forEach(img => {
      if (img.dataset.bound) return;
      img.dataset.bound='true';
      const failed = () => {
        if (!img.dataset.retried && img.dataset.fallback) {
          img.dataset.retried='true';
          img.removeAttribute('srcset');
          img.src=img.dataset.fallback;
        } else {
          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');
        }
      };
      img.addEventListener('error', failed);
      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});
      qs('[data-reset]',filters).addEventListener('click',()=>{search.value='';category.value='all';update();search.focus();});
    }
    all('[data-scroll-strip]',root).forEach(strip=>{
      if(strip.dataset.bound)return;
      strip.dataset.bound='true';
      const controls=qs(`[data-controls="${strip.id}"]`,root);
      if(!controls)return;
      const prev=qs('[data-prev]',controls), next=qs('[data-next]',controls);
      const sync=()=>{prev.disabled=strip.scrollLeft<3;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-3;};
      const move=dir=>strip.scrollBy({left:dir*(strip.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
      strip.addEventListener('scroll',sync,{passive:true});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(strip);
      sync();
    });
    const interval=qs('[data-interval]',root);
    if(interval&&!interval.dataset.bound){
      interval.dataset.bound='true';
      const surface=qs('.composition-stage',root),output=qs('[data-interval-output]',root);
      interval.addEventListener('input',()=>{surface.style.setProperty('--interval',interval.value);output.textContent=interval.value+'%';});
      qs('[data-reset-composition]',root)?.addEventListener('click',()=>{interval.value=45;interval.dispatchEvent(new Event('input'));});
    }
    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});
      qs('[data-reset-proportion]',root)?.addEventListener('click',()=>{split.value=36;split.dispatchEvent(new Event('input'));});
    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);
      function update(){preview.style.backgroundImage=`url("${pattern.value}")`;preview.style.backgroundSize=scale.value+'px auto';output.textContent=scale.value+' px';preview.setAttribute('aria-label',pattern.selectedOptions[0].text+' repeated at '+scale.value+' pixels');}
      pattern.addEventListener('change',update);scale.addEventListener('input',update);update();
    }
    const shuffle=qs('[data-shuffle]',root);
    if(shuffle&&!shuffle.dataset.bound){
      shuffle.dataset.bound='true';
      const board=qs('[data-shuffle-board]',root),original=all('.work-item',board);
      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
