int / The Ten Largest<\/p><h1>Beyond<br>the visible.<\/h1><p class=\"intro\">An atlas of growth, symbols, and shifting scale.<\/p><a class=\"text-link\" href=\"#works\">Open the atlas <span aria-hidden=\"true\">↗<\/span><\/a><br><span class=\"orb\" aria-hidden=\"true\">a ↔ b<\/span><\/div><div class=\"atlas-art\"><a class=\"art-link \" href=\"#works/number-4\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/hilma-af-klint_number-4.webp\" srcset=\"../../art-city/artworks/hilma-af-klint_number-4.webp 500w, ../../art-city/artworks/hilma-af-klint_number-4.webp 960w, ../../art-city/artworks/hilma-af-klint_number-4.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Ten Largest, No. 4, Youth. A dense constellation of curves and symbols unfolds across an orange ground.\" width=\"1342\" height=\"1800\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/hilma-af-klint_number-4.webp\"><div class=\"image-fallback\"><span>The Ten Largest, No. 4, Youth<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Ten Largest, No. 4, Youth<\/span><span class=\"art-group\">Youth<\/span><\/span><span class=\"art-year\">1907<\/span><\/figcaption><\/figure><\/a><\/div><\/section><section class=\"atlas-strip\"><div><p class=\"eyebrow\">A sequence, not a single answer<\/p><h2>Forms that grow<br>into other forms.<\/h2><p class=\"small\">Six paintings from a ten-part series. Follow a recurring shape from childhood to old age.<\/p><a class=\"text-link\" href=\"#extra\">See the series map <span aria-hidden=\"true\">↗<\/span><\/a><\/div><div class=\"atlas-pair\"><a class=\"art-link \" href=\"#works/number-2\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/hilma-af-klint_number-2.webp\" srcset=\"../../art-city/artworks/hilma-af-klint_number-2.webp 500w, sition is larger than a single glance can comfortably hold.\" data-work=\"number-4\"><a class=\"art-link \" href=\"#works/number-4\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/hilma-af-klint_number-4.webp\" srcset=\"../../art-city/artworks/hilma-af-klint_number-4.webp 500w, ../../art-city/artworks/hilma-af-klint_number-4.webp 960w, ../../art-city/artworks/hilma-af-klint_number-4.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Ten Largest, No. 4, Youth. A dense constellation of curves and symbols unfolds across an orange ground.\" width=\"1342\" height=\"1800\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/hilma-af-klint_number-4.webp\"><div class=\"image-fallback\"><span>The Ten Largest, No. 4, Youth<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Ten Largest, No. 4, Youth<\/span><span class=\"art-group\">Youth<\/span><\/span><span class=\"art-year\">1907<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Adulthood\" data-stage=\"Adulthood\" data-search=\"The Ten Largest, No. 5, Adulthood 1907 Adulthood Spirals, letters, and petal-like forms share the field. The organization becomes a language of recurring relationships rather than a fixed key.\" data-work=\"number-5\"><a class=\"art-link \" href=\"#works/number-5\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/hilma-af-klint_number-5.webp\" srcset=\"../../art-city/artworks/hilma-af-klint_number-5.webp 500w, ../../art-city/artworks/hilma-af-klint_number-5.webp 960w, ../../art-city/artworks/hilma-af-klint_number-5.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Ten Largest, No. 5, Adulthood. Spirals, letters, and petal-like forms share the field.\" width=\"1347\" height=\"1800\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/hilma-af-klint_number-5.webp\"><div class=\"image-fallback\"><span>The Ten Largest, No. 5, Adulthood<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Ten Largest, No. 5, Adulthood<\/span><span class=\"art-group\">Adulthood<\/span><\/span><span class=\"art-year\">1907<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Adulthood\" data-stage=\"Adulthood\" data-search=\"The Ten Largest, No. 7, Adulthood 1907 Adulthood Overlapping colored forms establish a patient, expansive rhythm. Small inscriptions suggest a system without offering a complete explanation.\" data-work=\"number-7\"><a class=\"art-link \" href=\"#works/number-7\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/hilma-af-klint_number-7.webp\" srcset=\"../../art-city/artworks/hilma-af-klint_number-7.webp 500w, ../../art-city/artworks/hilma-af-klint_number-7.webp 960w, ../../art-city/artworks/hilma-af-klint_number-7.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Ten Largest, No. 7, Adulthood. Overlapping colored forms establish a patient, expansive rhythm.\" width=\"1357\" height=\"1800\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/hilma-af-klint_number-7.webp\"><div class=\"image-fallback\"><span>The Ten Largest, No. 7, Adulthood<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Ten Largest, No. 7, Adulthood<\/span><span class=\"art-group\">Adulthood<\/span><\/span><span class=\"art-year\">1907<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Old age\" data-stage=\"Old age\" data-search=\"The Ten Largest, No. 9, Old Age 1907 Old age The composition turns toward pale ground and measured forms. Its quieter intervals remain active: emptiness is part of the structure.\" data-work=\"number-9\"><a class=\"art-link \" href=\"#works/number-9\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/hilma-af-klint_number-9.webp\" srcset=\"../../art-city/artworks/hilma-af-klint_number-9.webp 500w, ../../art-city/artworks/hilma-af-klint_number-9.webp 960w, ../../art-city/artworks/hilma-af-klint_number-9.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Ten Largest, No. 9, Old Age. The composition turns toward pale ground and measured forms.\" width=\"1353\" height=\"1800\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/hilma-af-klint_number-9.webp\"><div class=\"image-fallback\"><span>The Ten Largest, No. 9, Old Age<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Ten Largest, No. 9, Old Age<\/span><span class=\"art-group\">Old age<\/span><\/span><span class=\"art-year\">1907<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — Hilma af Klint"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>Hilma af Klint<\/h1><p class=\"intro\">1862–1944 / Painting · drawing / Sweden<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/number-3\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/hilma-af-klint_number-3.webp\" srcset=\"../../art-city/artworks/hilma-af-klint_number-3.webp 500w, ../../art-city/artworks/hilma-af-klint_number-3.webp 960w, ../../art-city/artworks/hilma-af-klint_number-3.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Ten Largest, No. 3, Youth. Large loops and organic shapes press against a richly colored field.\" width=\"1350\" height=\"1800\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/hilma-af-klint_number-3.webp\"><div class=\"image-fallback\"><span>The Ten Largest, No. 3, Youth<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Ten Largest, No. 3, Youth<\/span><span class=\"art-group\">Youth<\/span><\/span><span class=\"art-year\">1907<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>Hilma af Klint was a Swedish artist trained at the Royal Academy of Fine Arts in Stockholm. Alongside figurative work, she developed an abstract vocabulary informed by spiritual inquiry and collaborative practices.<\/p><p>The Ten Largest, made in 1907, links monumental painted surfaces with stages of human life. This selection presents six paintings from the series and keeps the sequence visible while allowing close, individual viewing.<\/p><h2>A way of looking<\/h2><p>A circle can resemble a cell, a planet, or a diagram without settling into one meaning. Follow the recurrence of forms across the series, and notice how their relationships change.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://hilmaafklint.se/about-hilma-af-klint/\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — Hilma af Klint"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1906–1915<\/span><div><h2>Paintings for the Temple<\/h2><p>The larger body of work to which The Ten Largest belongs.<\/p><a href=\"https://hilmaafklint.se/about-hilma-af-klint/\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1907<\/span><div><h2>The Ten Largest<\/h2><p>Ten monumental paintings considering the stages of life.<\/p><a href=\"https://www.guggenheim-bilbao.eus/en/exhibition/the-ten-largest-1907\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">2018–2019<\/span><div><h2>Hilma af Klint: Paintings for the Future<\/h2><p>Solomon R. Guggenheim Museum, New York. Historical exhibition.<\/p><a href=\"https://www.guggenheim.org/exhibition/hilma-af-klint\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — Hilma af Klint"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1> (() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);

          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');

      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});

      sync();
    });

    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});

    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);

    }

    if(shuffle&&!shuffle.dataset.bound){

      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
