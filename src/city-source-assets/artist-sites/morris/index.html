e, year, or subject\" autocomplete=\"off\"><\/label><label for=\"work-category\">Browse by theme<select id=\"work-category\" name=\"category\"><option value=\"all\">All themes<\/option><option value=\"Textile\">Textile<\/option><option value=\"Wallpaper\">Wallpaper<\/option><\/select><\/label><button type=\"button\" data-reset>Reset<\/button><output class=\"result-count\" data-result-count aria-live=\"polite\">6 of 6 works<\/output><\/form><section class=\"works-collection\" data-collection aria-label=\"Selected artworks\"><article class=\"work-item \" data-group=\"Textile\" data-stage=\"Textile\" data-search=\"Strawberry Thief 1883 Textile Birds, fruit, and curling stems are held in a dense repeat. Dark ground and small pale flowers let the pattern remain readable at several distances.\" data-work=\"strawberry-thief\"><a class=\"art-link \" href=\"#works/strawberry-thief\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_strawberry-thief.webp\" srcset=\"../../art-city/artworks/morris_strawberry-thief.webp 500w, ../../art-city/artworks/morris_strawberry-thief.webp 960w, ../../art-city/artworks/morris_strawberry-thief.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Strawberry Thief. Birds, fruit, and curling stems are held in a dense repeat.\" width=\"1496\" height=\"971\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/morris_strawberry-thief.webp\"><div class=\"image-fallback\"><span>Strawberry Thief<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Strawberry Thief<\/span><span class=\"art-group\">Textile<\/span><\/span><span class=\"art-year\">1883<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Textile\" data-stage=\"Textile\" data-search=\"Snakeshead 1876 Textile Drooping flower heads sit within a framework of stems and foliage. Small changes of direction animate an otherwise measured repeat.\" data-work=\"snakeshead\"><a class=\"art-link \" href=\"#works/snakeshead\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_snakeshead.webp\" srcset=\"../../art-city/artworks/morris_snakeshead.webp 500w, ../../art-city/artworks/morris_snakeshead.webp 960w, ../../art-city/artworks/morris_snakeshead.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Snakeshead. Drooping flower heads sit within a framework of stems and foliage.\" width=\"1458\" height=\"966\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/morris_snakeshead.webp\"><div class=\"image-fallback\"><span>Snakeshead<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Snakeshead<\/span><span class=\"art-group\">Textile<\/span><\/span><span class=\"art-year\">1876<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Wallpaper\" data-stage=\"Wallpaper\" data-search=\"Willow Boughs 1887 Wallpaper Slender leaves overlap along curling branches. The design is dense but not closed: pale spaces continue to circulate between the stems.\" data-work=\"willow-boughs\"><a class=\"art-link \" href=\"#works/willow-boughs\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_willow-boughs.webp\" alt=\"Willow Boughs. Slender leaves overlap along curling branches.\" width=\"968\" height=\"1474\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/morris_willow-boughs.webp\"><div class=\"image-fallback\"><span>Willow Boughs<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Willow Boughs<\/span><span class=\"art-group\">Wallpaper<\/span><\/span><span class=\"art-year\">1887<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Wallpaper\" data-stage=\"Wallpaper\" data-search=\"Trellis Designed 1862 Wallpaper Birds and climbing flowers cross a measured lattice. Designed by William Morris, with the birds drawn by Philip Webb, the pattern brings the garden against a geometric framework.\" data-work=\"trellis\"><a class=\"art-link \" href=\"#works/trellis\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_trellis.webp\" srcset=\"../../art-city/artworks/morris_trellis.webp 500w, ../../art-city/artworks/morris_trellis.webp 960w, ../../art-city/artworks/morris_trellis.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Trellis. Birds and climbing flowers cross a measured lattice.\" width=\"3069\" height=\"3857\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/morris_trellis.webp\"><div class=\"image-fallback\"><span>Trellis<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Trellis<\/span><span class=\"art-group\">Wallpaper<\/span><\/span><span class=\"art-year\">Designed 1862<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Wallpaper\" data-stage=\"Wallpaper\" data-search=\"Daisy 1864 Wallpaper Small flowers rise from evenly spaced tufts of foliage. The ground remains visible, giving the repeat a lighter, more open rhythm.\" data-work=\"daisy\"><a class=\"art-link \" href=\"#works/daisy\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_daisy.webp\" alt=\"Daisy. Small flowers rise from evenly spaced tufts of foliage.\" width=\"970\" height=\"1468\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/morris_daisy.webp\"><div class=\"image-fallback\"><span>Daisy<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Daisy<\/span><span class=\"art-group\">Wallpaper<\/span><\/span><span class=\"art-year\">1864<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Wallpaper\" data-stage=\"Wallpaper\" data-search=\"Acanthus 1875 Wallpaper Broad, curling leaves build a close, layered surface. The repeat depends on their shared movement rather than a conspicuous geometric frame.\" data-work=\"acanthus\"><a class=\"art-link \" href=\"#works/acanthus\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_acanthus.webp\" alt=\"Acanthus. Broad, curling leaves build a close, layered surface.\" width=\"392\" height=\"494\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/morris_acanthus.webp\"><div class=\"image-fallback\"><span>Acanthus<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Acanthus<\/span><span class=\"art-group\">Wallpaper<\/span><\/span><span class=\"art-year\">1875<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — William Morris"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>William Morris<\/h1><p class=\"intro\">1834–1896 / Textiles · wallpaper · book design / Britain<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/snakeshead\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_snakeshead.webp\" srcset=\"../../art-city/artworks/morris_snakeshead.webp 500w, ../../art-city/artworks/morris_snakeshead.webp 960w, ../../art-city/artworks/morris_snakeshead.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Snakeshead. Drooping flower heads sit within a framework of stems and foliage.\" width=\"1458\" height=\"966\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/morris_snakeshead.webp\"><div class=\"image-fallback\"><span>Snakeshead<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Snakeshead<\/span><span class=\"art-group\">Textile<\/span><\/span><span class=\"art-year\">1876<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>William Morris was a British designer, writer, and maker associated with the Arts and Crafts movement. His work encompassed textiles, wallpapers, books, and other objects intended for everyday surroundings.<\/p><p>His patterns combine close attention to plants with an exact understanding of repetition. A stem can guide the eye across a surface while smaller details prevent the repeat from feeling mechanical.<\/p><h2>A way of looking<\/h2><p>A repeat has two jobs: to hold together at a distance and to reward attention up close. Move between the whole surface and the individual leaf.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://www.vam.ac.uk/articles/introducing-william-morris\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — William Morris"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1861<\/span><div><h2>Morris, Marshall, Faulkner &amp; Co.<\/h2><p>The decorative-arts firm was established in London.<\/p><a href=\"https://www.vam.ac.uk/articles/introducing-william-morris\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1881<\/span><div><h2>Merton Abbey<\/h2><p>Morris moved textile production to Merton Abbey.<\/p><a href=\"https://www.vam.ac.uk/articles/introducing-william-morris\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1891–1896<\/span><div><h2>Kelmscott Press<\/h2><p>Morris’s bookmaking project brought type, ornament, and image together.<\/p><a href=\"https://www.vam.ac.uk/articles/introducing-william-morris\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — William Morris"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1>Continue the conversation.<\/h1><p class=\"intro\">For collection research, visiting information, and image requests, contact the relevant institution through its official website.<\/p><\/header><div class=\"contact-grid\"><section><h2>Go to the source.<\/h2><a class=\"resource-link\" href=\"https://www.vam.ac.uk/collections/william-morris\" target=\"_blank\" rel=\"noopener noreferrer\">Victoria and Albert Museum ↗<span>Official institution · collection and contact channels<\/span><\/a><a class=\"resource-link\" href=\"https://www.vam.ac.uk/articles/introducing-william-morris\" target=\"_blank\" rel=\"noopener noreferrer\">Biography &amp; research ↗<span>Background reading and further context<\/span><\/a><a class=\"resource-link\" href=\"#credits\">Image credits &amp; sources →<span>Artwork records, attributions, and reuse information<\/span><\/a><p class=\"editorial-note\">No representation, affiliation, authentication service, artwork sale, or estate contact is implied. This site does not accept messages on behalf of the artist.<\/p><\/section><section><h2>Prepare an inquiry.<\/h2><p class=\"small\" style=\"margin-bottom:25px\">Save a plain-text draft to send through an institution’s official channel. Nothing is transmitted or stored by this website.<\/p><form class=\"draft-form\" data-artist=\"William Morris\"><label for=\"inquiry-subject\">Subject<input id=\"inquiry-subject\" name=\"subject\" required maxlength=\"160\" placeholder=\"Question about a work or collection\"><\/label><label for=\"inquiry-message\">Your question<textarea id=\"inquiry-message\" name=\"message\" required minlength=\"10\" maxlength=\"5000\" placeholder=\"Include the artwork title, date, and what you would like to know.\"><\/textarea><\/label><button type=\"submit\">Download inquiry draft ↓<\/button><p class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/p><\/form><\/section><\/div><\/main>", "title": "Contact & resources — William Morris"}, "credits": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Sources &amp; image credits<\/p><h1>The record behind the image.<\/h1><p class=\"intro\">Artwork metadata and images are linked individually. Descriptions and looking notes are original editorial writing; no invented artist quotations are used.<\/p><\/header><p class=\"extra-intro small\">Artwork reproductions load from Wikimedia Commons or the linked institution. Reuse conditions attach to individual files. Photographs of sculptures can have separate copyrights from the sculpture itself. Consult each source record before republication. Cover images may be cropped; detail pages show the complete supplied image.<\/p><ul class=\"credits-list\"><li><span class=\"meta\">01<\/span><div><h2>Strawberry Thief<\/h2><p>1883 · Printed cotton<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Morris_Strawberry_Thief_1883.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Morris_Strawberry_Thief_1883.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">02<\/span><div><h2>Snakeshead<\/h2><p>1876 · Printed cotton<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Morris_Snakeshead_printed_textile_1876.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Morris_Snakeshead_printed_textile_1876.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">03<\/span><div><h2>Willow Boughs<\/h2><p>1887 · Wallpaper design<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Morris_Willow_Bough_1887.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Morris_Willow_Bough_1887.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">04<\/span><div><h2>Trellis<\/h2><p>Designed 1862 · Wallpaper design<br>Design: William Morris, with birds by Philip Webb. Reproduction: The Metropolitan Museum of Art, Open Access (CC0); via Wikimedia Commons.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Trellis_MET_DP306738.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Trellis_MET_DP306738.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">05<\/span><div><h2>Daisy<\/h2><p>1864 · Wallpaper design<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Morris_Daisy_wallpaper_1864.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Morris_Daisy_wallpaper_1864.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">06<\/span><div><h2>Acanthus<\/h2><p>1875 · Wallpaper design<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Morris_Acanthus_Wallpaper_1875.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Morris_Acanthus_Wallpaper_1875.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><\/ul><p class=\"small\">Biography source: <a href=\"https://www.vam.ac.uk/articles/introducing-william-morris\">Victoria and Albert Museum / institutional reading<\/a>. This independent design study has no affiliation with the named institutions.<\/p><\/main>", "title": "Image credits — William Morris"}, "extra": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Pattern room<\/p><h1>Repeat, scale, and surface<\/h1><p class=\"intro\">A closer way into this collection.<\/p><\/header><p class=\"extra-intro\">Compare a surface at different scales. This viewer repeats the supplied photograph; it is a viewing experiment, not a production-ready or necessarily seamless textile tile.<\/p><div class=\"lab-panel\"><div class=\"pattern-preview\" data-pattern-preview role=\"img\" aria-label=\"Repeated pattern preview\"><\/div><div class=\"lab-controls\"><label for=\"pattern-picker\">Choose a pattern<select id=\"pattern-picker\" data-pattern-picker style=\"padding:12px;background:var(--paper);max-width:100%\"><option value=\"../../art-city/artworks/morris_strawberry-thief.webp\">Strawberry Thief<\/option><option value=\"../../art-city/artworks/morris_snakeshead.webp\">Snakeshead<\/option><option value=\"../../art-city/artworks/morris_willow-boughs.webp\">Willow Boughs<\/option><option value=\"../../art-city/artworks/morris_trellis.webp\">Trellis<\/option><option value=\"../../art-city/artworks/morris_daisy.webp\">Daisy<\/option><option value=\"../../art-city/artworks/morris_acanthus.webp\">Acanthus<\/option><\/select><\/label><label for=\"pattern-scale\">Image width <output for=\"pattern-scale\" data-pattern-output>320 px<\/output><input id=\"pattern-scale\" data-pattern-scale type=\"range\" min=\"100\" max=\"600\" value=\"320\" step=\"10\"><\/label><p class=\"pattern-room-note\">Artwork images require an internet connection in the supplied preview. Sources and reuse records remain available on the artwork pages.<\/p><a class=\"text-link\" href=\"#works\">Return to the pattern library <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "Pattern room — William Morris"}, "works/strawberry-thief": {"html": "<main id=\"main\" class=\"detail-page\" tabindex=\"-1\"><nav class=\"breadcrumb\" aria-label=\"Breadcrumb\"><a href=\"#index\">William Morris<\/a><span aria-hidden=\"true\">/<\/span><a href=\"#works\">Works<\/a><span aria-hidden=\"true\">/<\/span><span>01<\/span><\/nav><article class=\"detail-layout\"><div class=\"detail-image\"><div class=\"art-frame \"><img src=\"../../art-city/artworks/morris_strawberry-thief.webp\" srcset=\"../../art-city/artworks/morris_strawberry-thief.webp 500w, ../../art-city/artworks/morris_strawberry-thief.webp 960w, ../../art-city/artworks/morris_strawberry-thief.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Strawberry Thief. Birds, fruit, and curling stems are held in a dense repeat.\" width=\"1496\" height=\"971\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/morris_strawberry-thief.webp\"><div class=\"image-fallback\"><span>Strawberry Thief<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><button type=\"button\" class=\"zoom-button\" data-zoom=\"../../art-city/artworks/morris_strawberry-thief.webp\" data-title=\"Strawberry Thief / 1883\" data-alt=\"Strawberry Thief. Birds, fruit, and curling stems are held in a dense repeat. Dark ground and small pale flowers let the pattern remain readable at several distances.\" data-source=\"https://commons.wikimedia.org/wiki/File:Morris_Strawberry_Thief_1883.jpg\">View in a quiet frame ↗<\/button><\/div><div class=\"detail-text\"><p class=\"eyebrow\">Textile / 01<\/p><h1>Strawberry Thief<\/h1><p class=\"description\">Birds, fruit, and curling stems are held in a dense repeat. Dark ground and small pale flowers let the pattern remain readable at several distances.<\/p><dl class=\"specs\"><div><dt>Artist<\/dt><dd>William Morris<\/dd><\/d (() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);
  const all = (s, r=document) => [...r.querySelectorAll(s)];
  let lastFocus = null;
  let toastTimer;
  function announce(text) {
    const toast = qs('.toast');
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {toast.hidden=true;}, 5000);
  }
  function initialize(root=document) {
    // Failed art never silently swaps to an unrelated image.
    all('img[data-fallback]', root).forEach(img => {
      if (img.dataset.bound) return;
      img.dataset.bound='true';
      const failed = () => {
        if (!img.dataset.retried && img.dataset.fallback) {
          img.dataset.retried='true';
          img.removeAttribute('srcset');
          img.src=img.dataset.fallback;
        } else {
          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');
        }
      };
      img.addEventListener('error', failed);
      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});
      qs('[data-reset]',filters).addEventListener('click',()=>{search.value='';category.value='all';update();search.focus();});
    }
    all('[data-scroll-strip]',root).forEach(strip=>{
      if(strip.dataset.bound)return;
      strip.dataset.bound='true';
      const controls=qs(`[data-controls="${strip.id}"]`,root);
      if(!controls)return;
      const prev=qs('[data-prev]',controls), next=qs('[data-next]',controls);
      const sync=()=>{prev.disabled=strip.scrollLeft<3;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-3;};
      const move=dir=>strip.scrollBy({left:dir*(strip.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
      strip.addEventListener('scroll',sync,{passive:true});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(strip);
      sync();
    });
    const interval=qs('[data-interval]',root);
    if(interval&&!interval.dataset.bound){
      interval.dataset.bound='true';
      const surface=qs('.composition-stage',root),output=qs('[data-interval-output]',root);
      interval.addEventListener('input',()=>{surface.style.setProperty('--interval',interval.value);output.textContent=interval.value+'%';});
      qs('[data-reset-composition]',root)?.addEventListener('click',()=>{interval.value=45;interval.dispatchEvent(new Event('input'));});
    }
    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});
      qs('[data-reset-proportion]',root)?.addEventListener('click',()=>{split.value=36;split.dispatchEvent(new Event('input'));});
    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);
      function update(){preview.style.backgroundImage=`url("${pattern.value}")`;preview.style.backgroundSize=scale.value+'px auto';output.textContent=scale.value+' px';preview.setAttribute('aria-label',pattern.selectedOptions[0].text+' repeated at '+scale.value+' pixels');}
      pattern.addEventListener('change',update);scale.addEventListener('input',update);update();
    }
    const shuffle=qs('[data-shuffle]',root);
    if(shuffle&&!shuffle.dataset.bound){
      shuffle.dataset.bound='true';
      const board=qs('[data-shuffle-board]',root),original=all('.work-item',board);
      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
