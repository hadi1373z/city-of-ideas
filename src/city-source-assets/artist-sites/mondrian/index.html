f balance.<\/h1><p class=\"intro\">From a tree’s branching structure to the interval between two planes.<\/p><\/div><div class=\"balance-art\"><a class=\"art-link \" href=\"#works/composition-red\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_composition-red.webp\" srcset=\"../../art-city/artworks/mondrian_composition-red.webp 500w, ../../art-city/artworks/mondrian_composition-red.webp 960w, ../../art-city/artworks/mondrian_composition-red.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Composition with Red, Blue and Yellow. A large red plane dominates the square while small blue and yellow areas adjust its weight.\" width=\"5918\" height=\"6000\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/mondrian_composition-red.webp\"><div class=\"image-fallback\"><span>Composition with Red, Blue and Yellow<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition with Red, Blue and Yellow<\/span><span class=\"art-group\">Planes<\/span><\/span><span class=\"art-year\">1930<\/span><\/figcaption><\/figure><\/a><\/div><div class=\"balance-red\"><span>LINE / PLANE / RELATIONSHIP<\/span><\/div><div class=\"balance-blue\"><a href=\"#works\">View the paintings <span aria-hidden=\"true\">↗<\/span><\/a><\/div><div class=\"balance-note\">Nothing here is quite equal.<br>That is where the balance begins.<\/div><div class=\"balance-yellow\" aria-hidden=\"true\">+<\/div><\/section><section class=\"balance-history\"><div class=\"history-text\"><p class=\"eyebrow\">Before the straight line<\/p><h2>The tree<br>is still here.<\/h2><p>Follow the branching structure of the early paintings into the divisions of the later ones.<\/p><a class=\"text-link\" href=\"#about\">Read the biography <span aria-hidden=\"true\">↗<\/span><\/a><\/div><a class=\"art-link \" href=\"#works/gray-tree\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_gray-tree.webp\" srcset=\"../../art-city/artworks/mondrian_gray-tree.webp 500w, ../../art-city/artworks/mondrian_gray-tree.webp 960w, ../../art-city/artworks/mondrian_gray-tree.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Gray Tree. Branches spread into a shallow gray field.\" width=\"1200\" height=\"900\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/mondrian_gray-tree.webp\"><div class=\"image-fallback\"><span>The Gray Tree<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Gray Tree<\/span><span class=\"art-group\">Trees<\/span><\/span><span class=\"art-year\">1911<\/span><\/figcaption><\/figure><\/a><\/section><\/div><\/main>", "title": "Piet Mondrian — An architecture of relationships"}, "works": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Selected works / 01–06<\/p><h1>Six relationships.<\/h1><p class=\"intro\">A selected collection, not a catalogue raisonné. Open any work for its image, context, and source record.<\/p><\/header><form class=\"filter-bar\" data-filters role=\"search\"><label for=\"work-search\">Find a work<input id=\"work-search\" type=\"search\" name=\"search\" placeholder=\"Title, year, or subject\" autocomplete=\"off\"><\/label><label for=\"work-category\">Browse by theme<select id=\"work-category\" name=\"category\"><option value=\"all\">All themes<\/option><option value=\"Trees\">Trees<\/option><option value=\"Planes\">Planes<\/option><\/select><\/label><button type=\"button\" data-reset>Reset<\/button><output class=\"result-count\" data-result-count aria-live=\"polite\">6 of 6 works<\/output><\/form><section class=\"works-collection\" data-collection aria-label=\"Selected artworks\"><article class=\"work-item \" data-group=\"Trees\" data-stage=\"Trees\" data-search=\"The Gray Tree 1911 Trees Branches spread into a shallow gray field. The tree remains recognizable even as its structure begins to share the logic of the surrounding space.\" data-work=\"gray-tree\"><a class=\"art-link \" href=\"#works/gray-tree\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_gray-tree.webp\" srcset=\"../../art-city/artworks/mondrian_gray-tree.webp 500w, ../../art-city/artworks/mondrian_gray-tree.webp 960w, ../../art-city/artworks/mondrian_gray-tree.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"The Gray Tree. Branches spread into a shallow gray field.\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/mondrian_gray-tree.webp\"><div class=\"image-fallback\"><span>The Gray Tree<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">The Gray Tree<\/span><span class=\"art-group\">Trees<\/span><\/span><span class=\"art-year\">1911<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Trees\" data-stage=\"Trees\" data-search=\"Evening (The Red Tree) 1908–1910 Trees A red trunk and branching limbs hold their shape against blue. The tension between color and observed form is already the main event.\" data-work=\"red-tree\"><a class=\"art-link \" href=\"#works/red-tree\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_red-tree.webp\" srcset=\"../../art-city/artworks/mondrian_red-tree.webp 500w, ../../art-city/artworks/mondrian_red-tree.webp 960w, ../../art-city/artworks/mondrian_red-tree.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Evening (The Red Tree). A red trunk and branching limbs hold their shape against blue.\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/mondrian_red-tree.webp\"><div class=\"image-fallback\"><span>Evening (The Red Tree)<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Evening (The Red Tree)<\/span><span class=\"art-group\">Trees<\/span><\/span><span class=\"art-year\">1908–1910<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Trees\" data-stage=\"Trees\" data-search=\"Flowering Apple Tree 1912 Trees The tree dissolves into arcs and faceted planes. A pale, restricted palette makes the relation of each line to its neighbors more visible.\" data-work=\"apple-tree\"><a class=\"art-link \" href=\"#works/apple-tree\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_apple-tree.webp\" srcset=\"../../art-city/artworks/mondrian_apple-tree.webp 500w, ../../art-city/artworks/mondrian_apple-tree.webp 960w, ../../art-city/artworks/mondrian_apple-tree.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Flowering Apple Tree. The tree dissolves into arcs and faceted planes.\" width=\"2362\" height=\"1725\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/mondrian_apple-tree.webp\"><div class=\"image-fallback\"><span>Flowering Apple Tree<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Flowering Apple Tree<\/span><span class=\"art-group\">Trees<\/span><\/span><span class=\"art-year\">1912<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Planes\" data-stage=\"Planes\" data-search=\"Composition with Red, Blue and Yellow 1930 Planes A large red plane dominates the square while small blue and yellow areas adjust its weight. Unequal divisions produce a deliberate equilibrium.\" data-work=\"composition-red\"><a class=\"art-link \" href=\"#works/composition-red\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_composition-red.webp\" srcset=\"../../art-city/artworks/mondrian_composition-red.webp 500w, ../../art-city/artworks/mondrian_composition-red.webp 960w, ../../art-city/artworks/mondrian_composition-red.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Composition with Red, Blue and Yellow. A large red plane dominates the square while small blue and yellow areas adjust its weight.\" width=\"5918\" height=\"6000\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/mondrian_composition-red.webp\"><div class=\"image-fallback\"><span>Composition with Red, Blue and Yellow<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition with Red, Blue and Yellow<\/span><span class=\"art-group\">Planes<\/span><\/span><span class=\"art-year\">1930<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Planes\" data-stage=\"Planes\" data-search=\"Composition with Large Red Plane, Yellow, Black, Gray and Blue 1921 Planes A broad red area is held against several narrower divisions. The black lines vary in their relationship to the edge rather than functioning as a neutral frame.\" data-work=\"composition-1921\"><a class=\"art-link \" href=\"#works/composition-1921\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_composition-1921.webp\" srcset=\"../../art-city/artworks/mondrian_composition-1921.webp 500w, ../../art-city/artworks/mondrian_composition-1921.webp 960w, ../../art-city/artworks/mondrian_composition-1921.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Composition with Large Red Plane, Yellow, Black, Gray and Blue. A broad red area is held against several narrower divisions.\" width=\"3543\" height=\"3532\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/mondrian_composition-1921.webp\"><div class=\"image-fallback\"><span>Composition with Large Red Plane, Yellow, Black, Gray and Blue<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition with Large Red Plane, Yellow, Black, Gray and Blue<\/span><span class=\"art-group\">Planes<\/span><\/span><span class=\"art-year\">1921<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"Planes\" data-stage=\"Planes\" data-search=\"Composition No. III, with Red, Blue, Yellow and Black 1929 Planes The arrangement makes modest differences of scale consequential. White surfaces, black boundaries, and color all participate in the balance.\" data-work=\"composition-1929\"><a class=\"art-link \" href=\"#works/composition-1929\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_composition-1929.webp\" srcset=\"../../art-city/artworks/mondrian_composition-1929.webp 500w, ../../art-city/artworks/mondrian_composition-1929.webp 960w, ../../art-city/artworks/mondrian_composition-1929.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Composition No. III, with Red, Blue, Yellow and Black. The arrangement makes modest differences of scale consequential.\" width=\"2872\" height=\"2861\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/mondrian_composition-1929.webp\"><div class=\"image-fallback\"><span>Composition No. III, with Red, Blue, Yellow and Black<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Composition No. III, with Red, Blue, Yellow and Black<\/span><span class=\"art-group\">Planes<\/span><\/span><span class=\"art-year\">1929<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — Piet Mondrian"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>Piet Mondrian<\/h1><p class=\"intro\">1872–1944 / Painting / The Netherlands / Paris / New York<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/red-tree\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/mondrian_red-tree.webp\" srcset=\"../../art-city/artworks/mondrian_red-tree.webp 500w, ../../art-city/artworks/mondrian_red-tree.webp 960w, ../../art-city/artworks/mondrian_red-tree.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Evening (The Red Tree). A red trunk and branching limbs hold their shape against blue.\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/mondrian_red-tree.webp\"><div class=\"image-fallback\"><span>Evening (The Red Tree)<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Evening (The Red Tree)<\/span><span class=\"art-group\">Trees<\/span><\/span><span class=\"art-year\">1908–1910<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>Piet Mondrian was a Dutch painter whose work developed from landscape toward increasingly abstract relationships of line and color. He was closely associated with De Stijl.<\/p><p>The mature paintings limit their means without becoming interchangeable. The width of a line, the proportion of a white field, and the position of a colored plane each alter the balance of the whole.<\/p><h2>A way of looking<\/h2><p>Do not read the grid as a cage. Read it as a set of proportions in negotiation: a small color can counterweight a much larger white space.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://www.tate.org.uk/art/artists/piet-mondrian-1651\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — Piet Mondrian"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1911–1912<\/span><div><h2>Toward Cubism<\/h2><p>The tree paintings show a vocabulary moving toward abstraction.<\/p><a href=\"https://www.tate.org.uk/art/artists/piet-mondrian-1651\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1917<\/span><div><h2>De Stijl<\/h2><p>Mondrian was a central participant in the movement.<\/p><a href=\"https://www.tate.org.uk/art/artists/piet-mondrian-1651\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1940<\/span><div><h2>New York<\/h2><p>The artist moved to New York, where he made his final paintings.<\/p><a href=\"https://www.tate.org.uk/art/artists/piet-mondrian-1651\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — Piet Mondrian"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1>Continue the conversation.<\/h1><p class=\"intro\">For collection research, visiting information, and image requests, contact the relevant institution through its official website.<\/p><\/header><div class=\"contact-grid\"><section><h2>Go to the source.<\/h2><a class=\"resource-link\" href=\"https://www.kunstmuseum.nl/en\" target=\"_blank\" rel=\"noopener noreferrer\">Kunstmuseum Den Haag ↗<span>Official institution · collection and contact channels<\/span><\/a><a class=\"resource-link\" href=\"https://www.tate.org.uk/art/artists/piet-mondrian-1651\" target=\"_blank\" rel=\"noopener noreferrer\">Biography &amp; research ↗<span>Background reading and further context<\/span><\/a><a class=\"resource-link\" href=\"#credits\">Image credits &amp; sources →<span>Artwork records, attributions, and reuse information<\/span><\/a><p class=\"editorial-note\">No representation, affiliation, authentication service, artwork sale, or estate contact is implied. This site does not accept messages on behalf of the artist.<\/p><\/section><section><h2>Prepare an inquiry.<\/h2><p class=\"small\" style=\"margin-bottom:25px\">Save a plain-text draft to send through an institution’s official channel. Nothing is transmitted or stored by this website.<\/p><form class=\"draft-form\" data-artist=\"Piet Mondrian\"><label for=\"inquiry-subject\">Subject<input id=\"inquiry-subject\" name=\"subject\" required maxlength=\"160\" placeholder=\"Question about a work or collection\"><\/label><label for=\"inquiry-message\">Your question<textarea id=\"inquiry-message\" name=\"message\" required minlength=\"10\" maxlength=\"5000\" placeholder=\"Include the artwork title, date, and what you would like to know.\"><\/textarea><\/label><button type=\"submit\">Download inquiry draft ↓<\/button><p class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/p><\/form><\/section><\/div><\/main>", "title": "Contact & resources — Piet Mondrian"}, "credits": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Sources &amp; image credits<\/p><h1>The record behind the image.<\/h1><p class=\"intro\">Artwork metadata and images are linked individually. Descriptions and looking notes are original editorial writing; no invented artist quotations are used.<\/p><\/header><p class=\"extra-intro small\">Artwork reproductions load from Wikimedia Commons or the linked institution. Reuse conditions attach to individual files. Photographs of sculptures can have separate copyrights from the sculpture itself. Consult each source record before republication. Cover images may be cropped; detail pages show the complete supplied image.<\/p><ul class=\"credits-list\"><li><span class=\"meta\">01<\/span><div><h2>The Gray Tree<\/h2><p>1911 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Gray_Tree_1911.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Gray_Tree_1911.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">02<\/span><div><h2>Evening (The Red Tree)<\/h2><p>1908–1910 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondrian%2C_1908-10%2C_Evening%3B_Red_Tree_(Avond%3B_De_rode_boom)%2C_oil_on_canvas%2C_70_x_99_cm%2C_Gemeentemuseum_Den_Haag.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondrian%2C_1908-10%2C_Evening%3B_Red_Tree_(Avond%3B_De_rode_boom)%2C_oil_on_canvas%2C_70_x_99_cm%2C_Gemeentemuseum_Den_Haag.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">03<\/span><div><h2>Flowering Apple Tree<\/h2><p>1912 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Blossoming_apple_tree%2C_by_Piet_Mondriaan.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Blossoming_apple_tree%2C_by_Piet_Mondriaan.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">04<\/span><div><h2>Composition with Red, Blue and Yellow<\/h2><p>1930 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondriaan%2C_1930_-_Mondrian_Composition_II_in_Red%2C_Blue%2C_and_Yellow.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondriaan%2C_1930_-_Mondrian_Composition_II_in_Red%2C_Blue%2C_and_Yellow.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">05<\/span><div><h2>Composition with Large Red Plane, Yellow, Black, Gray and Blue<\/h2><p>1921 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondriaan%2C_1921_-_Composition_en_rouge%2C_jaune%2C_bleu_et_noir.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondriaan%2C_1921_-_Composition_en_rouge%2C_jaune%2C_bleu_et_noir.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">06<\/span><div><h2>Composition No. III, with Red, Blue, Yellow and Black<\/h2><p>1929 · Oil on canvas<br>Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondrian_-_Composition_No._III%2C_with_red%2C_blue%2C_yellow_and_black%2C_1929.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondrian_-_Composition_No._III%2C_with_red%2C_blue%2C_yellow_and_black%2C_1929.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><\/ul><p class=\"small\">Biography source: <a href=\"https://www.tate.org.uk/art/artists/piet-mondrian-1651\">Kunstmuseum Den Haag / institutional reading<\/a>. This independent design study has no affiliation with the named institutions.<\/p><\/main>", "title": "Image credits — Piet Mondrian"}, "extra": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Proportion study<\/p><h1>Move one boundary<\/h1><p class=\"intro\">A closer way into this collection.<\/p><\/header><p class=\"extra-intro\">This is a designer-made proportional exercise, not a reproduction of a Mondrian painting. Move the dividing line. Watch v><div><dt>Date<\/dt><dd>1929<\/dd><\/div><div><dt>Medium<\/dt><dd>Oil on canvas<\/dd><\/div><div><dt>Dimensions<\/dt><dd>50 × 50.2 cm<\/dd><\/div><div><dt>Collection<\/dt><dd>Private collection; see the historical catalogue record<\/dd><\/div><\/dl><div class=\"detail-actions\"><button type=\"button\" data-citation=\"Piet Mondrian, Composition No. III, with Red, Blue, Yellow and Black, 1929. Oil on canvas. Private collection; see the historical catalogue record. https://commons.wikimedia.org/wiki/File:Piet_Mondrian_-_Composition_No._III%2C_with_red%2C_blue%2C_yellow_and_black%2C_1929.jpg\">Copy citation<\/button><a class=\"text-link small\" href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondrian_-_Composition_No._III%2C_with_red%2C_blue%2C_yellow_and_black%2C_1929.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Source record ↗<\/a><\/div><div class=\"source-note\">Public-domain artwork; reproduction via Wikimedia Commons. See image record for reuse details.<br><a href=\"https://commons.wikimedia.org/wiki/File:Piet_Mondrian_-_Composition_No._III%2C_with_red%2C_blue%2C_yellow_and_black%2C_1929.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image, attribution &amp; reuse record ↗<\/a><details style=\"margin-top:15px\"><summary>Read the citation<\/summary><p style=\"overflow-wrap:anywhere;margin-top:10px\">Piet Mondrian, Composition No. III, with Red, Blue, Yellow and Black, 1929. Oil on canvas. Private collection; see the historical catalogue record. https://commons.wikimedia.org/wiki/File:Piet_Mondrian_-_Composition_No._III%2C_with_red%2C_blue%2C_yellow_and_black%2C_1929.jpg<\/p><\/details><\/div><\/div><\/article><nav class=\"adjacent-works\" aria-label=\"Adjacent artworks\"><a href=\"#works/composition-1921\"><span>← Previous work<\/span>Composition with Large Red Plane, Yellow, Black, Gray and Blue<\/a><a href=\"#works/gray-tree\"><span>Next work →<\/span>The Gray Tree<\/a><\/nav><\/main>", "title": "Composition No. III, with Red, Blue, Yellow and Black — Piet Mondrian"}}</script><script>/* Framework-free enhancements. Content and navigation also work without JS. */
(() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);
  const all = (s, r=document) => [...r.querySelectorAll(s)];
  let lastFocus = null;
  let toastTimer;
  function announce(text) {
    const toast = qs('.toast');
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {toast.hidden=true;}, 5000);
  }
  function initialize(root=document) {
    // Failed art never silently swaps to an unrelated image.
    all('img[data-fallback]', root).forEach(img => {
      if (img.dataset.bound) return;
      img.dataset.bound='true';
      const failed = () => {
        if (!img.dataset.retried && img.dataset.fallback) {
          img.dataset.retried='true';
          img.removeAttribute('srcset');
          img.src=img.dataset.fallback;
        } else {
          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');
        }
      };
      img.addEventListener('error', failed);
      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});
      qs('[data-reset]',filters).addEventListener('click',()=>{search.value='';category.value='all';update();search.focus();});
    }
    all('[data-scroll-strip]',root).forEach(strip=>{
      if(strip.dataset.bound)return;
      strip.dataset.bound='true';
      const controls=qs(`[data-controls="${strip.id}"]`,root);
      if(!controls)return;
      const prev=qs('[data-prev]',controls), next=qs('[data-next]',controls);
      const sync=()=>{prev.disabled=strip.scrollLeft<3;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-3;};
      const move=dir=>strip.scrollBy({left:dir*(strip.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
      strip.addEventListener('scroll',sync,{passive:true});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(strip);
      sync();
    });
    const interval=qs('[data-interval]',root);
    if(interval&&!interval.dataset.bound){
      interval.dataset.bound='true';
      const surface=qs('.composition-stage',root),output=qs('[data-interval-output]',root);
      interval.addEventListener('input',()=>{surface.style.setProperty('--interval',interval.value);output.textContent=interval.value+'%';});
      qs('[data-reset-composition]',root)?.addEventListener('click',()=>{interval.value=45;interval.dispatchEvent(new Event('input'));});
    }
    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});
      qs('[data-reset-proportion]',root)?.addEventListener('click',()=>{split.value=36;split.dispatchEvent(new Event('input'));});
    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);
      function update(){preview.style.backgroundImage=`url("${pattern.value}")`;preview.style.backgroundSize=scale.value+'px auto';output.textContent=scale.value+' px';preview.setAttribute('aria-label',pattern.selectedOptions[0].text+' repeated at '+scale.value+' pixels');}
      pattern.addEventListener('change',update);scale.addEventListener('input',update);update();
    }
    const shuffle=qs('[data-shuffle]',root);
    if(shuffle&&!shuffle.dataset.bound){
      shuffle.dataset.bound='true';
      const board=qs('[data-shuffle-board]',root),original=all('.work-item',board);
      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
