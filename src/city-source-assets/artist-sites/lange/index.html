en walk along a road beneath a billboard advertising a different kind of travel. The photograph holds their journey and the commercial promise in the same frame.\" data-work=\"toward-la\"><a class=\"art-link \" href=\"#works/toward-la\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/lange_toward-la.webp\" srcset=\"../../art-city/artworks/lange_toward-la.webp 500w, ../../art-city/artworks/lange_toward-la.webp 960w, ../../art-city/artworks/lange_toward-la.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Toward Los Angeles, California. Two men walk along a road beneath a billboard advertising a different kind of travel.\" width=\"4084\" height=\"4208\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/lange_toward-la.webp\"><div class=\"image-fallback\"><span>Toward Los Angeles, California<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Toward Los Angeles, California<\/span><span class=\"art-group\">California<\/span><\/span><span class=\"art-year\">1937<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"California\" data-stage=\"California\" data-search=\"Children of an Oklahoma Drought Refugee, California 1936 California Children appear within the setting of a migratory camp. The archive identifies the family through their displacement from Oklahoma; the photograph also asks for attention to each person in the frame.\" data-work=\"children-camp\"><a class=\"art-link \" href=\"#works/children-camp\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/lange_children-camp.webp\" srcset=\"../../art-city/artworks/lange_children-camp.webp 500w, ../../art-city/artworks/lange_children-camp.webp 960w, ../../art-city/artworks/lange_children-camp.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Children of an Oklahoma Drought Refugee, California. Children appear within the setting of a migratory camp.\" width=\"5012\" height=\"3821\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/lange_children-camp.webp\"><div class=\"image-fallback\"><span>Children of an Oklahoma Drought Refugee, California<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Children of an Oklahoma Drought Refugee, California<\/span><span class=\"art-group\">California<\/span><\/span><span class=\"art-year\">1936<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"New Mexico\" data-stage=\"New Mexico\" data-search=\"Dust Storm near Mills, New Mexico 1935 New Mexico The view records a dust storm near Mills. Read the scene as both a landscape and evidence of conditions that shaped the lives of people working the land.\" data-work=\"dust-storm\"><a class=\"art-link \" href=\"#works/dust-storm\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/lange_dust-storm.webp\" srcset=\"../../art-city/artworks/lange_dust-storm.webp 500w, ../../art-city/artworks/lange_dust-storm.webp 960w, ../../art-city/artworks/lange_dust-storm.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Dust Storm near Mills, New Mexico. The view records a dust storm near Mills.\" width=\"4229\" height=\"2633\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/lange_dust-storm.webp\"><div class=\"image-fallback\"><span>Dust Storm near Mills, New Mexico<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Dust Storm near Mills, New Mexico<\/span><span class=\"art-group\">New Mexico<\/span><\/span><span class=\"art-year\">1935<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"California\" data-stage=\"California\" data-search=\"Pea Pickers’ Children, Nipomo, California 1935 California A photograph of children in a pea-picking community. The short archival caption places the scene within agricultural labor without supplying a complete account of the children’s lives.\" data-work=\"pea-pickers-children\"><a class=\"art-link \" href=\"#works/pea-pickers-children\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/lange_pea-pickers-children.webp\" srcset=\"../../art-city/artworks/lange_pea-pickers-children.webp 500w, ../../art-city/artworks/lange_pea-pickers-children.webp 960w, ../../art-city/artworks/lange_pea-pickers-children.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Pea Pickers’ Children, Nipomo, California. A photograph of children in a pea-picking community.\" width=\"1424\" height=\"1498\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/lange_pea-pickers-children.webp\"><div class=\"image-fallback\"><span>Pea Pickers’ Children, Nipomo, California<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Pea Pickers’ Children, Nipomo, California<\/span><span class=\"art-group\">California<\/span><\/span><span class=\"art-year\">1935<\/span><\/figcaption><\/figure><\/a><\/article><article class=\"work-item \" data-group=\"California\" data-stage=\"California\" data-search=\"Drought Refugees from Oklahoma, near Blythe 1936 California The photograph records a roadside camp near Blythe. Its title connects this temporary stopping place to a journey from Oklahoma.\" data-work=\"roadside-blythe\"><a class=\"art-link \" href=\"#works/roadside-blythe\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/lange_roadside-blythe.webp\" srcset=\"../../art-city/artworks/lange_roadside-blythe.webp 500w, ../../art-city/artworks/lange_roadside-blythe.webp 960w, ../../art-city/artworks/lange_roadside-blythe.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Drought Refugees from Oklahoma, near Blythe. The photograph records a roadside camp near Blythe.\" width=\"4586\" height=\"4474\" loading=\"lazy\" decoding=\"async\" data-fallback=\"../../art-city/artworks/lange_roadside-blythe.webp\"><div class=\"image-fallback\"><span>Drought Refugees from Oklahoma, near Blythe<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Drought Refugees from Oklahoma, near Blythe<\/span><span class=\"art-group\">California<\/span><\/span><span class=\"art-year\">1936<\/span><\/figcaption><\/figure><\/a><\/article><\/section><p class=\"empty-results\" data-empty hidden>No works match this search. Change the words or reset the filters.<\/p><\/main>", "title": "Works — Dorothea Lange"}, "about": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Life &amp; practice<\/p><h1>Dorothea Lange<\/h1><p class=\"intro\">1895–1965 / Documentary photography / United States<\/p><\/header><div class=\"about-grid\"><aside class=\"about-aside\"><a class=\"art-link \" href=\"#works/toward-la\"><figure><div class=\"art-frame \"><img src=\"../../art-city/artworks/lange_toward-la.webp\" srcset=\"../../art-city/artworks/lange_toward-la.webp 500w, ../../art-city/artworks/lange_toward-la.webp 960w, ../../art-city/artworks/lange_toward-la.webp 1280w\" sizes=\"(max-width: 600px) 92vw, (max-width: 1000px) 65vw, 900px\" alt=\"Toward Los Angeles, California. Two men walk along a road beneath a billboard advertising a different kind of travel.\" width=\"4084\" height=\"4208\" loading=\"eager\" decoding=\"async\" fetchpriority=\"high\" data-fallback=\"../../art-city/artworks/lange_toward-la.webp\"><div class=\"image-fallback\"><span>Toward Los Angeles, California<br>Image unavailable on this connection.<br>Open the artwork record for its source.<\/span><\/div><\/div><figcaption class=\"art-caption\"><span><span class=\"art-title\">Toward Los Angeles, California<\/span><span class=\"art-group\">California<\/span><\/span><span class=\"art-year\">1937<\/span><\/figcaption><\/figure><\/a><p class=\"editorial-note\">This is an independent artist-website design study, not an official artist, estate, foundation, or museum website.<\/p><\/aside><div class=\"prose\"><p>Dorothea Lange was an American photographer whose documentary work includes photographs made for federal agencies during the Great Depression. Her pictures attend to people as individuals while recording the conditions in which they lived and worked.<\/p><p>This selection treats the caption as part of the encounter. Place, date, and source matter; a familiar photograph should not become detached from the people and circumstances it records.<\/p><h2>A way of looking<\/h2><p>Start with what is visible, then read the record. A photograph is an encounter with a person, but it is also a frame: it includes some things and leaves others outside.<\/p><p class=\"source-note\">The looking note is original editorial writing, not a quotation or a statement attributed to the artist. Biography reference: <a href=\"https://www.loc.gov/static/collections/fsa-owi-black-and-white-negatives/articles-and-essays/documenting-america/migrant-workers.html\" target=\"_blank\" rel=\"noopener noreferrer\">institutional source ↗<\/a>.<\/p><h2>Selected chronology<\/h2><p class=\"source-note\">Follow the milestones and documented exhibitions in the historical record.<\/p><a class=\"text-link\" href=\"#exhibitions\">Exhibitions &amp; chronology <span aria-hidden=\"true\">↗<\/span><\/a><\/div><\/div><\/main>", "title": "About — Dorothea Lange"}, "exhibitions": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Exhibitions &amp; chronology<\/p><h1>A historical record.<\/h1><p class=\"intro\">Selected milestones and documented exhibitions. These are historical entries, not an announcement of current or upcoming events.<\/p><\/header><ol class=\"history-list\"><li class=\"history-item\"><span class=\"year\">1935–1939<\/span><div><h2>Federal documentary work<\/h2><p>Photographs made for the Resettlement Administration and Farm Security Administration.<\/p><a href=\"https://www.loc.gov/static/collections/fsa-owi-black-and-white-negatives/articles-and-essays/documenting-america/migrant-workers.html\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1936<\/span><div><h2>Nipomo, California<\/h2><p>The sequence of photographs associated with Migrant Mother.<\/p><a href=\"https://guides.loc.gov/migrant-mother\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><li class=\"history-item\"><span class=\"year\">1966<\/span><div><h2>Dorothea Lange<\/h2><p>Posthumous retrospective at The Museum of Modern Art, New York.<\/p><a href=\"https://www.moma.org/artists/3373\" target=\"_blank\" rel=\"noopener noreferrer\">Read the institutional record ↗<\/a><\/div><\/li><\/ol><p class=\"history-footnote\">This selection is not a complete exhibition history or professional CV. Follow the institutional links for catalogues, archival material, and fuller records.<\/p><\/main>", "title": "Exhibitions & chronology — Dorothea Lange"}, "contact": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Contact &amp; resources<\/p><h1>Continue the conversation.<\/h1><p class=\"intro\">For collection research, visiting information, and image requests, contact the relevant institution through its official website.<\/p><\/header><div class=\"contact-grid\"><section><h2>Go to the source.<\/h2><a class=\"resource-link\" href=\"https://www.loc.gov/pictures/collection/fsa/\" target=\"_blank\" rel=\"noopener noreferrer\">Library of Congress ↗<span>Official institution · collection and contact channels<\/span><\/a><a class=\"resource-link\" href=\"https://www.loc.gov/static/collections/fsa-owi-black-and-white-negatives/articles-and-essays/documenting-america/migrant-workers.html\" target=\"_blank\" rel=\"noopener noreferrer\">Biography &amp; research ↗<span>Background reading and further context<\/span><\/a><a class=\"resource-link\" href=\"#credits\">Image credits &amp; sources →<span>Artwork records, attributions, and reuse information<\/span><\/a><p class=\"editorial-note\">No representation, affiliation, authentication service, artwork sale, or estate contact is implied. This site does not accept messages on behalf of the artist.<\/p><\/section><section><h2>Prepare an inquiry.<\/h2><p class=\"small\" style=\"margin-bottom:25px\">Save a plain-text draft to send through an institution’s official channel. Nothing is transmitted or stored by this website.<\/p><form class=\"draft-form\" data-artist=\"Dorothea Lange\"><label for=\"inquiry-subject\">Subject<input id=\"inquiry-subject\" name=\"subject\" required maxlength=\"160\" placeholder=\"Question about a work or collection\"><\/label><label for=\"inquiry-message\">Your question<textarea id=\"inquiry-message\" name=\"message\" required minlength=\"10\" maxlength=\"5000\" placeholder=\"Include the artwork title, date, and what you would like to know.\"><\/textarea><\/label><button type=\"submit\">Download inquiry draft ↓<\/button><p class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/p><\/form><\/section><\/div><\/main>", "title": "Contact & resources — Dorothea Lange"}, "credits": {"html": "<main id=\"main\" class=\"content-page\" tabindex=\"-1\"><header class=\"page-heading\"><p class=\"eyebrow\">Sources &amp; image credits<\/p><h1>The record behind the image.<\/h1><p class=\"intro\">Artwork metadata and images are linked individually. Descriptions and looking notes are original editorial writing; no invented artist quotations are used.<\/p><\/header><p class=\"extra-intro small\">Artwork reproductions load from Wikimedia Commons or the linked institution. Reuse conditions attach to individual files. Photographs of sculptures can have separate copyrights from the sculpture itself. Consult each source record before republication. Cover images may be cropped; detail pages show the complete supplied image.<\/p><ul class=\"credits-list\"><li><span class=\"meta\">01<\/span><div><h2>Migrant Mother, Nipomo, California<\/h2><p>1936 · Black-and-white photograph<br>Dorothea Lange. U.S. federal agency photograph; public domain. Source record linked below.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Lange-MigrantMother02.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.loc.gov/pictures/item/2017762891/\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">02<\/span><div><h2>Toward Los Angeles, California<\/h2><p>1937 · Black-and-white photograph<br>Dorothea Lange. U.S. federal agency photograph; public domain. Source record linked below.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Toward_Los_Angeles%2C_California_LOC_3549663710.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Image / license record ↗<\/a> &nbsp; <a href=\"https://www.loc.gov/item/2017769825/\" target=\"_blank\" rel=\"noopener noreferrer\">Artwork record ↗<\/a><\/div><\/li><li><span class=\"meta\">03<\/span><div><h2>Children of an Oklahoma Drought Refugee, California<\/h2><p>1936 · Black-and-white photograph<br>Dorothea Lange. U.S. federal agency photograph; public domain. Source record linked below.<\/p><a href=\"https://commons.wikimedia.org/wiki/File:Dorothea_Lange%2C_Child (() => {
  'use strict';
  const qs = (s, r=document) => r.querySelector(s);
  const all = (s, r=document) => [...r.querySelectorAll(s)];
  let lastFocus = null;
  let toastTimer;
  function announce(text) {
    const toast = qs('.toast');
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {toast.hidden=true;}, 5000);
  }
  function initialize(root=document) {
    // Failed art never silently swaps to an unrelated image.
    all('img[data-fallback]', root).forEach(img => {
      if (img.dataset.bound) return;
      img.dataset.bound='true';
      const failed = () => {
        if (!img.dataset.retried && img.dataset.fallback) {
          img.dataset.retried='true';
          img.removeAttribute('srcset');
          img.src=img.dataset.fallback;
        } else {
          img.closest('.art-frame')?.classList.add('failed');
          img.closest('.pattern-backdrop')?.classList.add('failed');
        }
      };
      img.addEventListener('error', failed);
      img.addEventListener('load', () => img.closest('.art-frame')?.classList.remove('failed'));
      if(img.complete && !img.naturalWidth) failed();
    });
    const filters = qs('[data-filters]', root);
    if (filters && !filters.dataset.bound) {
      filters.dataset.bound='true';
      const grid=qs('[data-collection]',root);
      const items=all('.work-item',grid);
      const search=qs('[name=search]',filters);
      const category=qs('[name=category]',filters);
      const count=qs('[data-result-count]',filters);
      const empty=qs('[data-empty]',root);
      const update=() => {
        const term=search.value.trim().toLocaleLowerCase();
        const group=category.value;
        let visible=0;
        items.forEach(item=>{
          item.hidden=!(item.dataset.search.toLocaleLowerCase().includes(term) && (group==='all'||item.dataset.group===group));
          if(!item.hidden) visible++;
        });
        count.textContent=`${visible} of ${items.length} works`;
        empty.hidden=visible!==0;
      };
      search.addEventListener('input',update);
      category.addEventListener('change',update);
      filters.addEventListener('submit',e=>{e.preventDefault();update();});
      qs('[data-reset]',filters).addEventListener('click',()=>{search.value='';category.value='all';update();search.focus();});
    }
    all('[data-scroll-strip]',root).forEach(strip=>{
      if(strip.dataset.bound)return;
      strip.dataset.bound='true';
      const controls=qs(`[data-controls="${strip.id}"]`,root);
      if(!controls)return;
      const prev=qs('[data-prev]',controls), next=qs('[data-next]',controls);
      const sync=()=>{prev.disabled=strip.scrollLeft<3;next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-3;};
      const move=dir=>strip.scrollBy({left:dir*(strip.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      prev.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
      strip.addEventListener('scroll',sync,{passive:true});
      if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(strip);
      sync();
    });
    const interval=qs('[data-interval]',root);
    if(interval&&!interval.dataset.bound){
      interval.dataset.bound='true';
      const surface=qs('.composition-stage',root),output=qs('[data-interval-output]',root);
      interval.addEventListener('input',()=>{surface.style.setProperty('--interval',interval.value);output.textContent=interval.value+'%';});
      qs('[data-reset-composition]',root)?.addEventListener('click',()=>{interval.value=45;interval.dispatchEvent(new Event('input'));});
    }
    const split=qs('[data-proportion]',root);
    if(split&&!split.dataset.bound){
      split.dataset.bound='true';
      const surface=qs('.proportion-stage',root),out=qs('[data-proportion-output]',root);
      split.addEventListener('input',()=>{surface.style.setProperty('--split',split.value+'%');out.textContent=split.value+' : '+(100-Number(split.value));});
      qs('[data-reset-proportion]',root)?.addEventListener('click',()=>{split.value=36;split.dispatchEvent(new Event('input'));});
    }
    const pattern=qs('[data-pattern-picker]',root);
    if(pattern&&!pattern.dataset.bound){
      pattern.dataset.bound='true';
      const preview=qs('[data-pattern-preview]',root),scale=qs('[data-pattern-scale]',root),output=qs('[data-pattern-output]',root);
      function update(){preview.style.backgroundImage=`url("${pattern.value}")`;preview.style.backgroundSize=scale.value+'px auto';output.textContent=scale.value+' px';preview.setAttribute('aria-label',pattern.selectedOptions[0].text+' repeated at '+scale.value+' pixels');}
      pattern.addEventListener('change',update);scale.addEventListener('input',update);update();
    }
    const shuffle=qs('[data-shuffle]',root);
    if(shuffle&&!shuffle.dataset.bound){
      shuffle.dataset.bound='true';
      const board=qs('[data-shuffle-board]',root),original=all('.work-item',board);
      shuffle.addEventListener('click',()=>{
        const items=[...original];
        for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
        if(items.every((x,i)=>x===board.children[i]))items.push(items.shift());
        items.forEach(x=>board.append(x));announce('Notebook rearranged. All six works remain available.');
      });
      qs('[data-restore-order]',root)?.addEventListener('click',()=>{original.forEach(x=>board.append(x));announce('Original sequence restored.');});
    }
    all('.draft-form',root).forEach(form=>{
      if(form.dataset.bound)return;form.dataset.bound='true';
      form.addEventListener('submit',e=>{
        e.preventDefault();if(!form.reportValidity())return;
        const fd=new FormData(form);
        const draft=`RESEARCH INQUIRY DRAFT\nArtist: ${form.dataset.artist}\nSubject: ${fd.get('subject')}\n\n${fd.get('message')}\n\nThis is a local draft. Nothing has been sent.\nUse the institution's official contact channel linked on the site.\n`;
        const blob=new Blob([draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download='research-inquiry.txt';document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        qs('.form-status',form).textContent='Draft downloaded. No message or personal data has been sent.';
      });
    });
  }
  document.addEventListener('click',async e=>{
    const toggle=e.target.closest('.nav-toggle');
    if(toggle){const nav=document.getElementById(toggle.getAttribute('aria-controls'));const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Close':'Menu';nav.classList.toggle('is-open',open);return;}
    const close=e.target.closest('[data-close-lightbox]');
    if(close){qs('.lightbox')?.close();return;}
    const zoom=e.target.closest('[data-zoom]');
    if(zoom){
      const box=qs('.lightbox'),img=qs('img',box),caption=qs('[data-lightbox-caption]',box),source=qs('[data-lightbox-source]',box);
      lastFocus=zoom;const error=qs('[data-lightbox-error]',box);error.hidden=true;img.onerror=()=>{error.hidden=false;};img.onload=()=>{error.hidden=true;};img.src=zoom.dataset.zoom;img.alt=zoom.dataset.alt||zoom.dataset.title;caption.textContent=zoom.dataset.title;source.href=zoom.dataset.source;box.showModal();qs('[data-close-lightbox]',box).focus();return;
    }
    const citation=e.target.closest('[data-citation]');
    if(citation){
      try{await navigator.clipboard.writeText(citation.dataset.citation);announce('Artwork citation copied.');}
      catch{const area=document.createElement('textarea');area.value=citation.dataset.citation;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Artwork citation copied.':'Copy unavailable here. Use the citation displayed beneath the artwork.');citation.focus();}
      return;
    }
    const view=e.target.closest('[data-view]');
    if(view){const grid=qs('[data-collection]');grid.classList.toggle('list-view',view.dataset.view==='list');all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===view)));return;}
    const hub=e.target.closest('[data-hub]');
    if(hub&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'artist-home'},'*');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')all('.nav-toggle[aria-expanded=true]').forEach(b=>{b.click();b.focus();});
  });
  document.addEventListener('click',e=>{
    const nav=qs('.site-nav.is-open');
    if(nav&&!e.target.closest('.site-header')){const b=qs('.nav-toggle');b?.setAttribute('aria-expanded','false');if(b)b.textContent='Menu';nav.classList.remove('is-open');}
  });
  const lightbox=qs('.lightbox');
  lightbox?.addEventListener('close',()=>{lastFocus?.focus();});
  lightbox?.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close();});
  window.ArtistSites={initialize,announce};
  initialize();
})();
</script><script>/* Single-file preview router. The deployable sites use ordinary HTML links. */
(() => {
 'use strict';
 const pages=JSON.parse(document.getElementById('page-data').textContent);
 const mount=document.getElementById('route-mount');
 const menu=document.querySelector('.nav-toggle');
 function navigate(route){
   const key=typeof route==='string'?route:decodeURIComponent(location.hash.slice(1)||'index');
   const item=pages[key];
   document.querySelector('.lightbox')?.close();
   if(!item){mount.innerHTML='<main id="main" class="content-page" tabindex="-1"><h1>Page not found</h1><p>This page is not in the collection.</p><a href="#index">Return home</a></main>';document.title='Page not found';}
   else{mount.innerHTML=item.html;document.title=item.title;}
   document.body.dataset.page=key;
   document.querySelectorAll('.site-nav a').forEach(a=>{const current=a.getAttribute('href')==='#'+(key.startsWith('works/')?'works':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
   if(menu){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';document.querySelector('.site-nav')?.classList.remove('is-open');}
   window.ArtistSites?.initialize(mount);
   window.scrollTo({top:0,behavior:'instant'});
   if(window.__previewStarted)document.getElementById('main')?.focus({preventScroll:true});
   window.__previewStarted=true;
 }
 document.addEventListener('click',e=>{
   const a=e.target.closest('a');
   if(!a)return;
   const href=a.getAttribute('href');
   if(href==='#main'){e.preventDefault();document.getElementById('main')?.focus();return;}
   if(href?.startsWith('#')){e.preventDefault();navigate(decodeURIComponent(href.slice(1)||'index'));}
 });
 window.addEventListener('hashchange',navigate);
 navigate();
})();
</script></body></html>
